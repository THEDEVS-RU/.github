name: 'Build with Kaniko in K8s'
description: 'Builds Docker image using Kaniko pod inside Kubernetes'

inputs:
  image:
    description: 'Base target image name (e.g. registry.container-registry.svc.cluster.local:5000/thedevslk or registry.thedevs.ru/thedevslk)'
    required: true
  tag:
    description: 'Image tag'
    required: true
  namespace:
    description: 'K8s namespace'
    required: true
  git_token:
    description: 'GitHub Token for cloning repository context'
    required: true
  cache_pvc:
    description: 'PVC volume name for project build cache'
    required: true
  docker_secret:
    description: 'Secret name with registry auth (type kubernetes.io/dockerconfigjson)'
    required: false
    default: 'thedevs-registry-secret'
  registry_token:
    description: 'Auth token or password for corporate registry'
    required: false
    default: ''
  registry_username:
    description: 'Username for corporate registry'
    required: false
    default: 'thedevsru'
  registry_server:
    description: 'Server hostname for corporate registry'
    required: false
    default: 'registry.thedevs.ru'
  repo:
    description: 'Repository path for Kaniko context'
    required: false
    default: ''
  branch:
    description: 'Git branch to build'
    required: false
    default: ''
  cache_repo:
    description: 'Remote cache repository'
    required: false
    default: ''
  build_timeout:
    description: 'Build timeout in seconds'
    required: false
    default: '7200'
  dockerfile:
    description: 'Relative path to Dockerfile'
    required: false
    default: 'Dockerfile'
  claude_cli_version:
    description: 'Resolved Claude CLI version to pass via --build-arg=CLAUDE_CLI_VERSION. If CLAUDE_CLI_VERSION is also provided in build_args, build_args takes precedence.'
    required: false
    default: ''
  dockerhub_username:
    description: 'Docker Hub username for authenticated pulls'
    required: false
    default: ''
  dockerhub_token:
    description: 'Docker Hub PAT for authenticated pulls'
    required: false
    default: ''
  insecure:
    description: 'Pass --insecure flag to Kaniko'
    required: false
    default: 'true'
  insecure_pull:
    description: 'Pass --insecure-pull flag to Kaniko'
    required: false
    default: 'true'
  image_fs_extract_retry:
    description: 'Number of retries for Kaniko image fs extract'
    required: false
    default: '0'
  cpu_limit:
    description: 'CPU limit for Kaniko pod container (e.g. 16000m, 8). Set to 0 or none to remove CPU limit. Empty/omitted defaults to 16000m.'
    required: false
    default: '16000m'
  extra_tags:
    description: 'Comma- or whitespace-separated extra tags for target image'
    required: false
    default: ''
  build_args:
    description: 'Multiline list of build arguments (one KEY=VALUE per line) to pass to Kaniko. Not for secrets (visible in pod YAML). Overrides claude_cli_version if CLAUDE_CLI_VERSION is specified.'
    required: false
    default: ''
  gradle_secret:
    description: 'Pre-existing Kubernetes Secret name in namespace with gradle.properties key. Default: empty (opt-in).'
    required: false
    default: ''
  gradle_username:
    description: 'Username for Gradle private repository auth (repo.thedevs.ru). Must be provided together with gradle_password.'
    required: false
    default: ''
  gradle_password:
    description: 'Password for Gradle private repository auth (repo.thedevs.ru). Must be provided together with gradle_username.'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Run Kaniko Build
      shell: bash
      env:
        POD_NAME: kaniko-${{ github.run_id }}-${{ github.run_attempt }}
        IMAGE: ${{ inputs.image }}
        TAG: ${{ inputs.tag }}
        NS: ${{ inputs.namespace }}
        GIT_TOKEN: ${{ inputs.git_token }}
        SECRET: ${{ inputs.docker_secret }}
        CACHE_PVC: ${{ inputs.cache_pvc }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_CACHE_REPO: ${{ inputs.cache_repo }}
        INPUT_BUILD_TIMEOUT: ${{ inputs.build_timeout }}
        INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
        CLAUDE_CLI_VERSION: ${{ inputs.claude_cli_version }}
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub_username }}
        DOCKERHUB_TOKEN: ${{ inputs.dockerhub_token }}
        REGISTRY_TOKEN: ${{ inputs.registry_token }}
        REGISTRY_USERNAME: ${{ inputs.registry_username }}
        REGISTRY_SERVER: ${{ inputs.registry_server }}
        INSECURE: ${{ inputs.insecure }}
        INSECURE_PULL: ${{ inputs.insecure_pull }}
        IMAGE_FS_EXTRACT_RETRY: ${{ inputs.image_fs_extract_retry }}
        INPUT_CPU_LIMIT: ${{ inputs.cpu_limit }}
        INPUT_EXTRA_TAGS: ${{ inputs.extra_tags }}
        INPUT_BUILD_ARGS: ${{ inputs.build_args }}
        INPUT_GRADLE_SECRET: ${{ inputs.gradle_secret }}
        INPUT_GRADLE_USERNAME: ${{ inputs.gradle_username }}
        INPUT_GRADLE_PASSWORD: ${{ inputs.gradle_password }}
        CACHEBUST: ${{ github.run_id }}-${{ github.run_attempt }}
        CALLER_REPO: ${{ github.repository }}
        CALLER_REF: ${{ github.ref_name }}
      run: |
        set +e
        IMAGE_FULL="${IMAGE}:${TAG}"
        CACHE_REPO="${INPUT_CACHE_REPO:-${IMAGE}/cache}"
        BUILD_TIMEOUT="${INPUT_BUILD_TIMEOUT:-7200}"
        DOCKERFILE="${INPUT_DOCKERFILE:-Dockerfile}"

        if [ -n "$INPUT_REPO" ]; then
          case "$INPUT_REPO" in
            github.com/*) REPO="$INPUT_REPO" ;;
            *) REPO="github.com/${INPUT_REPO}" ;;
          esac
          case "$REPO" in
            *.git) ;;
            *) REPO="${REPO}.git" ;;
          esac
        else
          REPO="github.com/${CALLER_REPO}.git"
        fi

        BRANCH="${INPUT_BRANCH:-${CALLER_REF}}"

        DOCKERHUB_B64=""
        if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
          DOCKERHUB_B64=$(printf '%s:%s' "$DOCKERHUB_USERNAME" "$DOCKERHUB_TOKEN" | base64 -w0)
        fi

        REGISTRY_B64=""
        if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_TOKEN" ]; then
          REGISTRY_B64=$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_TOKEN" | base64 -w0)
        fi

        MAX_ATTEMPTS=3
        DEADLINE=$((BUILD_TIMEOUT + 600))
        API_TIMEOUT=600
        NOT_FOUND_LIMIT=5
        TRANSIENT_RE='error resolving source|connection reset by peer|i/o timeout|TLS handshake timeout|unexpected EOF|no such host|temporary failure in name resolution|502 Bad Gateway|Evicted'
        CLONE_NOISE_RE='^(Enumerating objects:|Counting objects:|Compressing objects:|Receiving objects:|Resolving deltas:|remote:)'

        # --- Shared constants ---
        CPU_REQUEST_MILLIS=1000
        CPU_REQUEST_STR="${CPU_REQUEST_MILLIS}m"
        DEFAULT_CPU_LIMIT="16000m"

        trim() {
          local val="$1"
          val="${val#"${val%%[![:space:]]*}"}"
          val="${val%"${val##*[![:space:]]}"}"
          printf '%s' "$val"
        }

        # Validate claude_cli_version if provided
        if [ -n "$CLAUDE_CLI_VERSION" ]; then
          if [[ "$CLAUDE_CLI_VERSION" == *[$'"\r\n'\\\"\']* ]]; then
            echo "::error::Invalid characters in claude_cli_version: quotes, backslashes, and newlines are forbidden."
            exit 1
          fi
        fi

        # Validate and normalize cpu_limit
        CPU_LIMIT="${INPUT_CPU_LIMIT:-$DEFAULT_CPU_LIMIT}"
        CPU_LIMIT="$(trim "$CPU_LIMIT")"
        [ -z "$CPU_LIMIT" ] && CPU_LIMIT="$DEFAULT_CPU_LIMIT"
        REMOVE_CPU_LIMIT=0
        CPU_LIMIT_LOWER=$(printf '%s' "$CPU_LIMIT" | tr '[:upper:]' '[:lower:]')
        if [ "$CPU_LIMIT_LOWER" = "0" ] || [ "$CPU_LIMIT_LOWER" = "0m" ] || [ "$CPU_LIMIT_LOWER" = "none" ]; then
          REMOVE_CPU_LIMIT=1
        else
          if [[ "$CPU_LIMIT" == *$'\n'* ]] || ! [[ "$CPU_LIMIT" =~ ^([0-9]{1,7}m|[0-9]{1,5}(\.[0-9]{1,3})?)$ ]]; then
            echo "::error::Invalid cpu_limit format: '$CPU_LIMIT'. Must be Kubernetes CPU quantity (e.g. 16000m, 8), 0, or none."
            exit 1
          fi
          case "$CPU_LIMIT" in
            *m)
              CPU_MILLIS=$((10#${CPU_LIMIT%m}))
              ;;
            *.*)
              CPU_MILLIS=$(awk -v val="$CPU_LIMIT" 'BEGIN { printf "%.0f", val * 1000 }')
              ;;
            *)
              CPU_MILLIS=$((10#$CPU_LIMIT * 1000))
              ;;
          esac
          if [ "$CPU_MILLIS" -lt "$CPU_REQUEST_MILLIS" ]; then
            echo "::error::cpu_limit '$CPU_LIMIT' (${CPU_MILLIS}m) cannot be less than requests.cpu (${CPU_REQUEST_STR}). Set to 0 or none to remove limit."
            exit 1
          fi
        fi

        # Validate and parse extra_tags
        VALIDATED_EXTRA_TAGS=()
        if [ -n "$INPUT_EXTRA_TAGS" ]; then
          while IFS= read -r tag_line || [ -n "$tag_line" ]; do
            tag_line="$(trim "$tag_line")"
            [ -z "$tag_line" ] && continue
            set -f
            for single_tag in ${tag_line//,/ }; do
              [ -z "$single_tag" ] && continue
              if ! [[ "$single_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
                echo "::error::Invalid docker tag format in extra_tags: '$single_tag'."
                set +f
                exit 1
              fi
              VALIDATED_EXTRA_TAGS+=("$single_tag")
            done
            set +f
          done <<< "$INPUT_EXTRA_TAGS"
        fi

        # Validate and parse build_args
        VALIDATED_BUILD_ARGS=()
        declare -A SEEN_BUILD_ARGS=()
        if [ -n "$INPUT_BUILD_ARGS" ]; then
          while IFS= read -r line || [ -n "$line" ]; do
            line="$(trim "$line")"
            [ -z "$line" ] && continue
            case "$line" in
              '#'*) continue ;;
            esac
            if ! [[ "$line" =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::Invalid build_args line: '$line'. Must match KEY=VALUE syntax."
              exit 1
            fi
            if [[ "$line" == *[\"\\]* ]]; then
              echo "::error::Invalid build_args line: '$line'. Quotes (\") and backslashes (\\) are forbidden."
              exit 1
            fi
            BARG_KEY="${line%%=*}"
            if [ "$BARG_KEY" = "CACHEBUST" ]; then
              echo "::error::build_args key 'CACHEBUST' is reserved by kaniko-build action."
              exit 1
            fi
            if [ -n "${SEEN_BUILD_ARGS[$BARG_KEY]:-}" ]; then
              echo "::error::Duplicate build_arg key '$BARG_KEY' in build_args."
              exit 1
            fi
            SEEN_BUILD_ARGS["$BARG_KEY"]=1
            VALIDATED_BUILD_ARGS+=("$line")
          done <<< "$INPUT_BUILD_ARGS"
        fi

        HAS_CLAUDE_CLI_ARG=0
        if [ -n "${SEEN_BUILD_ARGS["CLAUDE_CLI_VERSION"]:-}" ]; then
          HAS_CLAUDE_CLI_ARG=1
        fi

        if [ -n "$CLAUDE_CLI_VERSION" ] && [ "$HAS_CLAUDE_CLI_ARG" -eq 1 ]; then
          echo "::warning::CLAUDE_CLI_VERSION provided via both claude_cli_version and build_args. build_args takes precedence."
        fi

        if [ -n "$SECRET" ]; then
          echo "Verifying docker secret '$SECRET' in namespace '$NS'..."
          SECRET_CHECK_ERR=$(kubectl -n "$NS" get secret "$SECRET" --request-timeout=15s 2>&1 >/dev/null || true)
          if [ -n "$SECRET_CHECK_ERR" ]; then
            if printf '%s' "$SECRET_CHECK_ERR" | grep -F -q 'NotFound'; then
              if [ -n "$REGISTRY_TOKEN" ]; then
                echo "::warning::Docker secret '$SECRET' not found in namespace '$NS', but registry_token is provided — proceeding with token auth"
              else
                echo "::error::Docker secret '$SECRET' specified but not found in namespace '$NS'"
                exit 1
              fi
            else
              echo "::warning::Could not verify secret '$SECRET' in namespace '$NS' (proceeding with optional volume): $SECRET_CHECK_ERR"
            fi
          fi
        fi

        GRADLE_SECRET="$(trim "${INPUT_GRADLE_SECRET:-}")"
        GRADLE_USERNAME="${INPUT_GRADLE_USERNAME:-}"
        GRADLE_PASSWORD="${INPUT_GRADLE_PASSWORD:-}"

        if [[ "$GRADLE_USERNAME" == *$'\r'* ]] || [[ "$GRADLE_USERNAME" == *$'\n'* ]] || \
           [[ "$GRADLE_PASSWORD" == *$'\r'* ]] || [[ "$GRADLE_PASSWORD" == *$'\n'* ]]; then
          echo "::error::gradle_username and gradle_password must not contain CR or LF characters."
          exit 1
        fi

        if [ -n "$GRADLE_USERNAME" ] && [ -z "$GRADLE_PASSWORD" ]; then
          echo "::error::Both gradle_username and gradle_password must be specified together."
          exit 1
        fi
        if [ -z "$GRADLE_USERNAME" ] && [ -n "$GRADLE_PASSWORD" ]; then
          echo "::error::Both gradle_username and gradle_password must be specified together."
          exit 1
        fi

        USE_TEMP_GRADLE_SECRET=0
        GRADLE_SECRET_NAME=""
        if [ -n "$GRADLE_USERNAME" ] && [ -n "$GRADLE_PASSWORD" ]; then
          USE_TEMP_GRADLE_SECRET=1
        elif [ -n "$GRADLE_SECRET" ]; then
          GRADLE_SECRET_NAME="$GRADLE_SECRET"
          echo "Verifying gradle secret '$GRADLE_SECRET' in namespace '$NS'..."
          GRADLE_SECRET_CHECK_ERR=$(kubectl -n "$NS" get secret "$GRADLE_SECRET" --request-timeout=15s 2>&1 >/dev/null || true)
          if [ -n "$GRADLE_SECRET_CHECK_ERR" ]; then
            if printf '%s' "$GRADLE_SECRET_CHECK_ERR" | grep -F -q 'NotFound'; then
              echo "::error::Gradle secret '$GRADLE_SECRET' specified but not found in namespace '$NS'"
              exit 1
            else
              echo "::warning::Could not verify gradle secret '$GRADLE_SECRET' in namespace '$NS' (proceeding with volume mount): $GRADLE_SECRET_CHECK_ERR"
            fi
          fi
        fi

        CREATED_GRADLE_SECRETS=()
        GRADLE_PROP_FILE=""

        cleanup_gradle_secrets() {
          [ -n "${GRADLE_PROP_FILE:-}" ] && rm -f "$GRADLE_PROP_FILE" 2>/dev/null || true
          if [ "$USE_TEMP_GRADLE_SECRET" -eq 1 ]; then
            for s in "${CREATED_GRADLE_SECRETS[@]}"; do
              [ -n "$s" ] && kubectl -n "$NS" delete secret "$s" --ignore-not-found --wait=false --request-timeout=30s >/dev/null 2>&1 || true
            done
          fi
        }
        trap cleanup_gradle_secrets EXIT
        trap 'cleanup_gradle_secrets; exit 130' INT TERM

        ATTEMPT=1
        while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
          POD="${POD_NAME}-a${ATTEMPT}"
          PHASE_OUT="${RUNNER_TEMP:-/tmp}/kaniko-phase-${ATTEMPT}.out"
          PHASE_ERR="${RUNNER_TEMP:-/tmp}/kaniko-phase-${ATTEMPT}.err"

          echo "BUILD_ATTEMPT: $ATTEMPT/$MAX_ATTEMPTS"
          kubectl -n "$NS" delete pod "$POD" --force --grace-period=0 --ignore-not-found --request-timeout=30s >/dev/null 2>&1
          sleep 1

          if [ "$USE_TEMP_GRADLE_SECRET" -eq 1 ]; then
            GRADLE_SECRET_NAME="${POD}-gradle"
            GRADLE_PROP_FILE="${RUNNER_TEMP:-/tmp}/${POD}-gradle.properties"

            # Экранирование обратного слэша для формата java.util.Properties
            GRADLE_USER_ESCAPED="${GRADLE_USERNAME//\\/\\\\}"
            GRADLE_PASS_ESCAPED="${GRADLE_PASSWORD//\\/\\\\}"

            (
              umask 077
              cat > "$GRADLE_PROP_FILE" <<EOF
        thedevsRepoUser=$GRADLE_USER_ESCAPED
        thedevsRepoPassword=$GRADLE_PASS_ESCAPED
        uploadUser=$GRADLE_USER_ESCAPED
        uploadPassword=$GRADLE_PASS_ESCAPED
        EOF
            )
            chmod 600 "$GRADLE_PROP_FILE"

            # Выполнение в подоболочке с set -o pipefail для корректного перехвата ошибок любой команды пайпа
            APPLY_SECRET_OUT=$( (set -o pipefail; kubectl -n "$NS" create secret generic "$GRADLE_SECRET_NAME" \
              --from-file="gradle.properties=$GRADLE_PROP_FILE" \
              --dry-run=client -o yaml | kubectl apply --request-timeout=30s -f -) 2>&1 )
            APPLY_SECRET_RC=$?
            rm -f "$GRADLE_PROP_FILE"

            if [ "$APPLY_SECRET_RC" -ne 0 ]; then
              if printf '%s' "$APPLY_SECRET_OUT" | grep -F -q 'Forbidden'; then
                echo "::error::RBAC permission denied to create temporary gradle secret '$GRADLE_SECRET_NAME' in namespace '$NS'. Ensure the service account from BUILDER_CONFIG_K8S has 'create' and 'delete' verbs on 'secrets'. Details: $(printf '%s' "$APPLY_SECRET_OUT" | tr '\n' ' ' | cut -c1-200)"
                exit 1
              fi
              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                BACKOFF=10
                [ "$ATTEMPT" -eq 2 ] && BACKOFF=30
                echo "Transient failure creating gradle secret — retrying in ${BACKOFF}s"
                sleep "$BACKOFF"
                ATTEMPT=$((ATTEMPT + 1))
                continue
              fi
              echo "::error::Failed to create temporary gradle secret '$GRADLE_SECRET_NAME' in namespace '$NS': $(printf '%s' "$APPLY_SECRET_OUT" | tr '\n' ' ' | cut -c1-200)"
              exit 1
            fi

            CREATED_GRADLE_SECRETS+=("$GRADLE_SECRET_NAME")
          fi

          echo "BUILD_START: $IMAGE_FULL"
          APPLY_OUT=$(
            {
              cat <<EOF
        apiVersion: v1
        kind: Pod
        metadata:
          name: $POD
          namespace: $NS
          labels:
            app: kaniko-builder
        spec:
          activeDeadlineSeconds: $DEADLINE
          initContainers:
          - name: merge-docker-config
            image: busybox:1.36
            command: ["sh", "-c"]
            args:
            - |
              cp /secret-orig/.dockerconfigjson /docker-config/config.json 2>/dev/null || echo '{"auths":{}}' > /docker-config/config.json
              tr -d '\r\n' < /docker-config/config.json > /docker-config/config.json.flat && mv /docker-config/config.json.flat /docker-config/config.json
              if [ -n "\$REGISTRY_B64" ]; then
                sed -i -E "s|,[[:space:]]*\"\$REGISTRY_SERVER\"[[:space:]]*:[[:space:]]*\{[^{}]*\}||g" /docker-config/config.json
                sed -i -E "s|\"\$REGISTRY_SERVER\"[[:space:]]*:[[:space:]]*\{[^{}]*\}[[:space:]]*,?||g" /docker-config/config.json
                if grep -q -E '"auths"[[:space:]]*:[[:space:]]*\{[[:space:]]*\}' /docker-config/config.json; then
                  sed -i -E 's|"auths"[[:space:]]*:[[:space:]]*\{[[:space:]]*\}|"auths":{"'"\$REGISTRY_SERVER"'":{"auth":"'"\$REGISTRY_B64"'"}}|' /docker-config/config.json
                elif grep -q -E '"auths"[[:space:]]*:[[:space:]]*\{' /docker-config/config.json; then
                  sed -i -E 's|"auths"[[:space:]]*:[[:space:]]*\{|"auths":{"'"\$REGISTRY_SERVER"'":{"auth":"'"\$REGISTRY_B64"'"},|' /docker-config/config.json
                else
                  echo '{"auths":{"'"\$REGISTRY_SERVER"'":{"auth":"'"\$REGISTRY_B64"'"}}}' > /docker-config/config.json
                fi
                if ! grep -q "\$REGISTRY_SERVER" /docker-config/config.json; then
                  echo "::error::Failed to inject registry auth for \$REGISTRY_SERVER"
                  exit 1
                fi
              fi
              if [ -n "\$DOCKERHUB_B64" ]; then
                DH_SRV="https://index.docker.io/v1/"
                sed -i -E "s|,[[:space:]]*\"\$DH_SRV\"[[:space:]]*:[[:space:]]*\{[^{}]*\}||g" /docker-config/config.json
                sed -i -E "s|\"\$DH_SRV\"[[:space:]]*:[[:space:]]*\{[^{}]*\}[[:space:]]*,?||g" /docker-config/config.json
                if grep -q -E '"auths"[[:space:]]*:[[:space:]]*\{[[:space:]]*\}' /docker-config/config.json; then
                  sed -i -E 's|"auths"[[:space:]]*:[[:space:]]*\{[[:space:]]*\}|"auths":{"https://index.docker.io/v1/":{"auth":"'"\$DOCKERHUB_B64"'"}}|' /docker-config/config.json
                elif grep -q -E '"auths"[[:space:]]*:[[:space:]]*\{' /docker-config/config.json; then
                  sed -i -E 's|"auths"[[:space:]]*:[[:space:]]*\{|"auths":{"https://index.docker.io/v1/":{"auth":"'"\$DOCKERHUB_B64"'"},|' /docker-config/config.json
                else
                  echo '{"auths":{"https://index.docker.io/v1/":{"auth":"'"\$DOCKERHUB_B64"'"}}}' > /docker-config/config.json
                fi
                if ! grep -q "https://index.docker.io/v1/" /docker-config/config.json; then
                  echo "::error::Failed to inject Docker Hub auth"
                  exit 1
                fi
              fi
            env:
            - name: DOCKERHUB_B64
              value: "${DOCKERHUB_B64}"
            - name: REGISTRY_B64
              value: "${REGISTRY_B64}"
            - name: REGISTRY_SERVER
              value: "${REGISTRY_SERVER}"
            volumeMounts:
            - name: secret-orig
              mountPath: /secret-orig
              readOnly: true
            - name: docker-config
              mountPath: /docker-config
            resources:
              requests:
                memory: "32Mi"
                cpu: "50m"
              limits:
                memory: "64Mi"
                cpu: "100m"
          containers:
          - name: kaniko
            image: gcr.io/kaniko-project/executor:v1.23.2
            args:
            - "--context=git://x-access-token:${GIT_TOKEN}@${REPO}#refs/heads/${BRANCH}"
            - "--destination=${IMAGE_FULL}"
        EOF
              for EXTRA_TAG in "${VALIDATED_EXTRA_TAGS[@]}"; do
                cat <<EOF
            - "--destination=${IMAGE}:${EXTRA_TAG}"
        EOF
              done
              cat <<EOF
            - "--dockerfile=${DOCKERFILE}"
            - "--build-arg=CACHEBUST=${CACHEBUST}"
        EOF
              if [ -n "$CLAUDE_CLI_VERSION" ] && [ "$HAS_CLAUDE_CLI_ARG" -eq 0 ]; then
                CLAUDE_ESCAPED="${CLAUDE_CLI_VERSION//\$/\$\$}"
                cat <<EOF
            - "--build-arg=CLAUDE_CLI_VERSION=${CLAUDE_ESCAPED}"
        EOF
              fi
              for BARG in "${VALIDATED_BUILD_ARGS[@]}"; do
                BARG_ESCAPED="${BARG//\$/\$\$}"
                cat <<EOF
            - "--build-arg=${BARG_ESCAPED}"
        EOF
              done
              if [ "$INSECURE" = "true" ]; then
                cat <<EOF
            - "--insecure"
        EOF
              fi
              if [ "$INSECURE_PULL" = "true" ]; then
                cat <<EOF
            - "--insecure-pull"
        EOF
              fi
              if [ -n "$IMAGE_FS_EXTRACT_RETRY" ] && [ "$IMAGE_FS_EXTRACT_RETRY" -gt 0 ] 2>/dev/null; then
                cat <<EOF
            - "--image-fs-extract-retry=${IMAGE_FS_EXTRACT_RETRY}"
        EOF
              fi
              cat <<EOF
            - "--cache=true"
            - "--cache-repo=${CACHE_REPO}"
            - "--cache-ttl=168h"
            resources:
              requests:
                memory: "2Gi"
                cpu: "${CPU_REQUEST_STR}"
              limits:
                memory: "8Gi"
        EOF
              if [ "$REMOVE_CPU_LIMIT" -eq 0 ]; then
                cat <<EOF
                cpu: "${CPU_LIMIT}"
        EOF
              fi
              cat <<EOF
            volumeMounts:
            - name: docker-config
              mountPath: /kaniko/.docker
            - name: shared-cache
              mountPath: /root/.gradle/wrapper
              subPath: gradle-wrapper
            - name: shared-cache
              mountPath: /root/.vaadin
              subPath: vaadin-root-cache
            - name: shared-cache
              mountPath: /root/.gradle/nodejs
              subPath: gradle-nodejs
            - name: shared-cache
              mountPath: /root/.npm
              subPath: npm-cache
            - name: project-cache
              mountPath: /root/.gradle/caches
        EOF
              if [ -n "$GRADLE_SECRET_NAME" ]; then
                cat <<EOF
            - name: gradle-secret
              mountPath: /root/.gradle/gradle.properties
              subPath: gradle.properties
              readOnly: true
        EOF
              fi
              cat <<EOF
          restartPolicy: Never
          volumes:
        EOF
              if [ -n "$SECRET" ]; then
                cat <<EOF
          - name: secret-orig
            secret:
              secretName: $SECRET
              optional: true
        EOF
              else
                cat <<EOF
          - name: secret-orig
            emptyDir: {}
        EOF
              fi
              cat <<EOF
          - name: docker-config
            emptyDir: {}
          - name: shared-cache
            persistentVolumeClaim:
              claimName: kaniko-cache
          - name: project-cache
            persistentVolumeClaim:
              claimName: ${CACHE_PVC}
        EOF
              if [ -n "$GRADLE_SECRET_NAME" ]; then
                cat <<EOF
          - name: gradle-secret
            secret:
              secretName: $GRADLE_SECRET_NAME
              items:
              - key: gradle.properties
                path: gradle.properties
              defaultMode: 0400
        EOF
              fi
            } | kubectl apply --request-timeout=30s -f - 2>&1
          )
          APPLY_RC=$?
          printf '%s\n' "$APPLY_OUT"

          if [ "$APPLY_RC" -ne 0 ]; then
            if [ "$USE_TEMP_GRADLE_SECRET" -eq 1 ]; then
              kubectl -n "$NS" delete secret "$GRADLE_SECRET_NAME" --ignore-not-found --wait=false --request-timeout=30s >/dev/null 2>&1 || true
            fi
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              BACKOFF=10
              [ "$ATTEMPT" -eq 2 ] && BACKOFF=30
              echo "Transient apply failure detected — retrying in ${BACKOFF}s"
              sleep "$BACKOFF"
              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi
            echo "BUILD_FAILED: kubectl apply failed: $(printf '%s' "$APPLY_OUT" | tr '\n' ' ' | cut -c1-200)"
            exit 1
          fi

          if [ "$USE_TEMP_GRADLE_SECRET" -eq 1 ]; then
            POD_UID=$(kubectl -n "$NS" get pod "$POD" -o jsonpath='{.metadata.uid}' --request-timeout=15s 2>/dev/null || true)
            if [ -n "$POD_UID" ]; then
              PATCH_ERR=$(kubectl -n "$NS" patch secret "$GRADLE_SECRET_NAME" --type=merge --request-timeout=15s \
                -p "{\"metadata\":{\"ownerReferences\":[{\"apiVersion\":\"v1\",\"kind\":\"Pod\",\"name\":\"$POD\",\"uid\":\"$POD_UID\",\"blockOwnerDeletion\":false}]}}" 2>&1 >/dev/null || true)
              if [ -n "$PATCH_ERR" ]; then
                echo "::warning::Failed to set ownerReferences on secret '$GRADLE_SECRET_NAME': $PATCH_ERR"
              fi
            else
              echo "::warning::Could not obtain UID of pod '$POD' to set ownerReferences on secret '$GRADLE_SECRET_NAME'"
            fi
          fi

          timeout 300s sh -c 'until kubectl -n "'"$NS"'" wait --for=condition=Ready "pod/'"$POD"'" --timeout=60s --request-timeout=30s 2>/dev/null; do sleep 5; done' || true

          PHASE="Running"
          API_FAIL_SINCE=0
          NOT_FOUND_FAILS=0
          POD_GONE=0
          API_EXHAUSTED=0
          TIMED_OUT=0
          SECONDS=0

          while [ "$SECONDS" -lt "$BUILD_TIMEOUT" ] && [ "$PHASE" != "Succeeded" ] && [ "$PHASE" != "Failed" ]; do
            sleep 3
            kubectl -n "$NS" get pod "$POD" -o jsonpath='{.status.phase}' --request-timeout=30s >"$PHASE_OUT" 2>"$PHASE_ERR"
            RC=$?
            POLL_OUT=$(cat "$PHASE_OUT" 2>/dev/null)
            POLL_ERR=$(cat "$PHASE_ERR" 2>/dev/null)

            if [ "$RC" -eq 0 ] && [ -n "$POLL_OUT" ]; then
              PHASE="$POLL_OUT"
              API_FAIL_SINCE=0
              NOT_FOUND_FAILS=0
            elif [ "$RC" -eq 0 ]; then
              API_FAIL_SINCE=0
              NOT_FOUND_FAILS=0
            elif printf '%s' "$POLL_ERR" | grep -F -q '(NotFound)'; then
              API_FAIL_SINCE=0
              NOT_FOUND_FAILS=$((NOT_FOUND_FAILS + 1))
              echo "Pod $POD not found (attempt $NOT_FOUND_FAILS/$NOT_FOUND_LIMIT)..."
              if [ "$NOT_FOUND_FAILS" -ge "$NOT_FOUND_LIMIT" ]; then
                POD_GONE=1
                PHASE="Failed"
              fi
            else
              NOT_FOUND_FAILS=0
              if [ "$API_FAIL_SINCE" -eq 0 ]; then
                API_FAIL_SINCE=$SECONDS
              fi
              FAIL_ELAPSED=$((SECONDS - API_FAIL_SINCE))
              ERR_SNIP=$(printf '%s' "$POLL_ERR" | tr '\n' ' ' | cut -c1-160)
              echo "API unavailable for ${FAIL_ELAPSED}s (limit ${API_TIMEOUT}s): ${ERR_SNIP}"
              if [ "$FAIL_ELAPSED" -ge "$API_TIMEOUT" ]; then
                echo "BUILD_FAILED: kubernetes API unavailable for ${FAIL_ELAPSED}s"
                API_EXHAUSTED=1
                PHASE="Failed"
              fi
            fi
          done

          if [ "$PHASE" != "Succeeded" ] && [ "$PHASE" != "Failed" ]; then
            echo "BUILD_FAILED: build timed out after ${SECONDS}s (limit ${BUILD_TIMEOUT}s)"
            TIMED_OUT=1
            PHASE="Failed"
          fi

          echo "BUILD_RESULT: $PHASE"

          if [ "$PHASE" = "Succeeded" ]; then
            kubectl -n "$NS" delete pod "$POD" --ignore-not-found --wait=false --request-timeout=30s >/dev/null 2>&1
            rm -f "$PHASE_OUT" "$PHASE_ERR"
            exit 0
          fi

          echo "=========================================="
          echo "BUILD_FAILED"
          echo "=========================================="
          echo ""
          echo "=== POD STATUS ==="
          POD_YAML=""
          for i in 1 2 3; do
            POD_YAML=$(kubectl -n "$NS" get pod "$POD" -o yaml --request-timeout=120s 2>&1) && break
            echo "Retry $i..." && sleep 5
          done
          printf '%s\n' "$POD_YAML" | grep -A 30 "status:"
          POD_REASON=$(printf '%s\n' "$POD_YAML" | grep -E '^[[:space:]]*reason:' | head -5)
          echo ""
          echo "=== POD EVENTS ==="
          for i in 1 2 3; do
            kubectl -n "$NS" describe pod "$POD" --request-timeout=120s 2>&1 | grep -A 50 "Events:" && break
            echo "Retry $i..." && sleep 5
          done
          echo ""
          echo "=== CONTAINER LOGS ==="
          LOGS=""
          for i in 1 2 3; do
            LOGS=$(kubectl -n "$NS" logs "$POD" --all-containers=true --tail=-1 --request-timeout=240s 2>&1) && break
            echo "Retry $i..." && sleep 5
          done
          if [ -z "$LOGS" ]; then
            echo "Failed to get logs after retries"
          else
            echo "--- error lines ---"
            printf '%s\n' "$LOGS" | grep "rror"
            echo "--- last 200 lines (git clone progress filtered) ---"
            printf '%s\n' "$LOGS" | grep -Ev "$CLONE_NOISE_RE" | tail -200
          fi
          echo ""
          echo "=========================================="

          if [ "$POD_GONE" -eq 0 ]; then
            kubectl -n "$NS" delete pod "$POD" --ignore-not-found --wait=false --request-timeout=30s >/dev/null 2>&1 || true
          fi

          rm -f "$PHASE_OUT" "$PHASE_ERR"

          if [ "$POD_GONE" -eq 1 ]; then
            echo "Build failed: pod was confirmed deleted externally"
            exit 1
          fi

          if [ "$API_EXHAUSTED" -eq 1 ]; then
            echo "Build failed: kubernetes API unavailable for ${FAIL_ELAPSED}s"
            exit 1
          fi

          if [ "$TIMED_OUT" -eq 1 ]; then
            echo "Build failed: build timed out after ${SECONDS}s"
            exit 1
          fi

          if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ] && printf '%s\n%s\n' "$LOGS" "$POD_REASON" | grep -qEi "$TRANSIENT_RE"; then
            BACKOFF=10
            [ "$ATTEMPT" -eq 2 ] && BACKOFF=30
            echo "Transient failure detected — retrying in ${BACKOFF}s"
            sleep "$BACKOFF"
            ATTEMPT=$((ATTEMPT + 1))
            continue
          fi

          exit 1
        done

        exit 1
