def createSafeDocumentBuilder() {
    def dbf = DocumentBuilderFactory.newInstance()
    dbf.setNamespaceAware(true)
    try {
        dbf.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true)
        dbf.setFeature("http://xml.org/sax/features/external-general-entities", false)
        dbf.setFeature("http://xml.org/sax/features/external-parameter-entities", false)
    } catch (Exception ignored) {}
    return dbf.newDocumentBuilder()
}

def cleanXmlWhitespace(Node node) {
    def children = node.childNodes
    for (int i = children.length - 1; i >= 0; i--) {
        def child = children.item(i)
        if (child.nodeType == Node.TEXT_NODE && child.textContent.trim().isEmpty()) {
            node.removeChild(child)
        } else if (child.nodeType == Node.ELEMENT_NODE) {
            cleanXmlWhitespace(child)
        }
    }
}

def localXmlTag(Node node) {
    return (node.localName ?: node.nodeName).replaceFirst('^.*:', '')
}

def findInsertBefore(Element parent, List<String> targetTags) {
    def children = parent.childNodes
    for (int i = 0; i < children.length; i++) {
        def ch = children.item(i)
        if (ch.nodeType == Node.ELEMENT_NODE) {
            def tag = localXmlTag(ch)
            if (targetTags.contains(tag)) {
                return ch
            }
        }
    }
    return null
}

def textValues(Element parent, String tagName) {
    def values = new LinkedHashSet<String>()
    def nodes = parent.getElementsByTagName(tagName)
    for (int i = 0; i < nodes.length; i++) {
        def txt = nodes.item(i).textContent?.trim()
        if (txt) values.add(txt)
    }
    return values
}

def writeXmlDocument(Document doc, File destFile) {
    cleanXmlWhitespace(doc.documentElement)
    destFile.parentFile.mkdirs()
    def tf = TransformerFactory.newInstance().newTransformer()
    tf.setOutputProperty(OutputKeys.ENCODING, "UTF-8")
    tf.setOutputProperty(OutputKeys.INDENT, "yes")
    tf.setOutputProperty("{http://xml.apache.org/xslt}indent-amount", "4")
    destFile.withOutputStream { os ->
        tf.transform(new DOMSource(doc), new StreamResult(os))
    }
}

def resolveProjectTestLiquibaseChangelog(Project p) {
    if (!p.pluginManager.hasPlugin('java')) return null

    // 1. From test task systemProperties
    def testTask = p.tasks.findByName('test')
    if (testTask instanceof Test) {
        def sysVal = testTask.systemProperties['main.liquibase.change-log'] ?: testTask.systemProperties['spring.liquibase.change-log']
        if (sysVal != null && !sysVal.toString().trim().isEmpty()) {
            return sysVal.toString().trim()
        }
    }

    // 2. From test resources property files (*.properties)
    for (File resDir : p.sourceSets.test.resources.srcDirs) {
        if (!resDir.exists()) continue
        def propFiles = []
        resDir.eachFileRecurse { f ->
            if (f.isFile() && f.name.endsWith('.properties')) {
                propFiles.add(f)
            }
        }
        for (File pf : propFiles) {
            def props = new Properties()
            try {
                pf.withInputStream { props.load(it) }
                def val = props.getProperty('main.liquibase.change-log') ?: props.getProperty('spring.liquibase.change-log')
                if (val != null && !val.trim().isEmpty()) {
                    return val.trim()
                }
            } catch (Exception ignored) {}
        }
    }

    // 3. From main resources changelog XML files
    for (File resDir : p.sourceSets.main.resources.srcDirs) {
        if (!resDir.exists()) continue
        File found = null
        resDir.eachFileRecurse { f ->
            if (f.isFile() && (f.name == 'changelog.xml' || f.name == 'master.xml') && f.parentFile?.name == 'liquibase') {
                if (found == null) found = f
            }
        }
        if (found != null) {
            return resDir.toPath().relativize(found.toPath()).toString().replace('\\', '/')
        }
    }

    // 4. From test resources changelog XML files
    for (File resDir : p.sourceSets.test.resources.srcDirs) {
        if (!resDir.exists()) continue
        File found = null
        resDir.eachFileRecurse { f ->
            if (f.isFile() && (f.name == 'changelog.xml' || f.name == 'master.xml') && f.parentFile?.name == 'liquibase') {
                if (found == null) found = f
            }
        }
        if (found != null) {
            return resDir.toPath().relativize(found.toPath()).toString().replace('\\', '/')
        }
    }

    return null
}

def resolveHostMainLiquibaseChangelog(Project p) {
    if (!p.pluginManager.hasPlugin('java')) return null
    File found = null
    File matchedResDir = null
    for (File resDir : p.sourceSets.main.resources.srcDirs) {
        if (!resDir.exists()) continue
        resDir.eachFileRecurse { f ->
            if (f.isFile() && (f.name == 'changelog.xml' || f.name == 'master.xml') && f.parentFile?.name == 'liquibase') {
                if (found == null) {
                    found = f
                    matchedResDir = resDir
                }
            }
        }
        if (found != null) break
    }
    if (found != null && matchedResDir != null) {
        def relPath = matchedResDir.toPath().relativize(found.toPath()).toString().replace('\\', '/')
        return [path: relPath, file: found]
    }
    return null
}

// 1.6. TD-2533: Module Liquibase changelogs resolution
def normalizeLiquibasePath(String raw) {
    if (raw == null) return null
    def s = raw.trim().replace('\\', '/')
    if (s.startsWith('classpath:')) {
        s = s.substring('classpath:'.length())
    }
    while (s.startsWith('/')) {
        s = s.substring(1)
    }
    return s
}

def resolveModuleLiquibaseChangelogs(Project p) {
    def runtimeClasspath = p.configurations.findByName('runtimeClasspath')
    if (runtimeClasspath == null) return []

    // 1. Files of components from resolved artifacts: group:name -> List<File>
    Map<String, List<File>> filesByComponent = new LinkedHashMap<>()
    try {
        def artifacts = runtimeClasspath.resolvedConfiguration.resolvedArtifacts
        for (def art : artifacts) {
            if (art.file == null) continue
            def mvid = art.moduleVersion?.id
            if (mvid != null) {
                String key = "${mvid.group}:${mvid.name}".toString()
                filesByComponent.computeIfAbsent(key, { new ArrayList<File>() }).add(art.file)
            }
            if (art.id?.componentIdentifier instanceof ProjectComponentIdentifier) {
                def pid = art.id.componentIdentifier as ProjectComponentIdentifier
                def subproject = p.rootProject.findProject(pid.projectPath)
                if (subproject != null) {
                    String prjGroup = subproject.group?.toString() ?: p.group?.toString() ?: ''
                    String prjKey = "${prjGroup}:${subproject.name}".toString()
                    filesByComponent.computeIfAbsent(prjKey, { new ArrayList<File>() }).add(art.file)
                }
            }
        }
    } catch (Exception e) {
        println "::warning::[TD-2533] Could not resolve artifacts for runtimeClasspath: ${e.message}"
    }

    // 2. Helper to get component info and key
    def getComponentInfo = { ResolvedComponentResult comp ->
        String group = comp.moduleVersion?.group ?: ''
        String name = comp.moduleVersion?.name ?: ''
        boolean isProject = (comp.id instanceof ProjectComponentIdentifier)
        if (isProject && (group.isEmpty() || name.isEmpty())) {
            def pid = comp.id as ProjectComponentIdentifier
            def prj = p.rootProject.findProject(pid.projectPath)
            if (group.isEmpty()) group = prj?.group?.toString() ?: p.group?.toString() ?: ''
            if (name.isEmpty()) name = prj?.name ?: pid.projectName
        }
        String key = "${group}:${name}".toString()
        boolean matchesFilter = isProject || group.startsWith('ru.thedevs') || group.startsWith('io.jmix')
        return [group: group, name: name, key: key, isProject: isProject, matchesFilter: matchesFilter]
    }

    // 3. Depth-first search in post-order (dependencies before dependents)
    def root = runtimeClasspath.incoming.resolutionResult.root
    def rootInfo = getComponentInfo(root)
    Set<String> visited = new HashSet<>()
    if (rootInfo.key) {
        visited.add(rootInfo.key)
    }

    List<Map> orderedCandidates = new ArrayList<>()

    def visit
    visit = { ResolvedComponentResult comp ->
        def validDeps = comp.dependencies.findAll { dep ->
            (dep instanceof ResolvedDependencyResult) && !(dep as ResolvedDependencyResult).constraint
        }.collect { it as ResolvedDependencyResult }

        validDeps.sort { a, b ->
            def infoA = getComponentInfo(a.selected)
            def infoB = getComponentInfo(b.selected)
            return (infoA.key ?: '') <=> (infoB.key ?: '')
        }

        for (ResolvedDependencyResult dep : validDeps) {
            def child = dep.selected
            def childInfo = getComponentInfo(child)
            if (childInfo.key && !visited.contains(childInfo.key)) {
                visited.add(childInfo.key)
                visit(child)
                if (childInfo.matchesFilter) {
                    orderedCandidates.add(childInfo)
                }
            }
        }
    }

    visit(root)

    // 4. Search for changelogs in each component's files
    def changelogPattern = ~/^(?!META-INF\/).+\/liquibase\/changelog\.xml$/
    Set<String> seenNormalizedPaths = new LinkedHashSet<>()
    List<Map> result = new ArrayList<>()

    for (def cand : orderedCandidates) {
        def files = filesByComponent[cand.key] ?: []
        List<Map> candChangelogs = new ArrayList<>()

        for (File rootFile : files) {
            if (rootFile == null || !rootFile.exists()) {
                throw new GradleException("[TD-2533] Unreadable artifact '${rootFile?.absolutePath}': file does not exist")
            }

            if (rootFile.isDirectory()) {
                try {
                    rootFile.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                        String rel = rootFile.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                        if (rel.startsWith('/')) rel = rel.substring(1)
                        if (rel =~ changelogPattern) {
                            candChangelogs.add([path: rel, component: cand.key, root: rootFile])
                        }
                    }
                } catch (Exception e) {
                    throw new GradleException("[TD-2533] Unreadable artifact directory '${rootFile.absolutePath}': ${e.message}", e)
                }
            } else if (rootFile.isFile()) {
                java.util.zip.ZipFile zf = null
                try {
                    zf = new java.util.zip.ZipFile(rootFile)
                    def entries = zf.entries()
                    while (entries.hasMoreElements()) {
                        def entry = entries.nextElement()
                        if (!entry.isDirectory()) {
                            String entryName = entry.name.replace('\\', '/')
                            if (entryName.startsWith('/')) entryName = entryName.substring(1)
                            if (entryName =~ changelogPattern) {
                                candChangelogs.add([path: entryName, component: cand.key, root: rootFile])
                            }
                        }
                    }
                } catch (Exception e) {
                    throw new GradleException("[TD-2533] Unreadable artifact archive '${rootFile.absolutePath}': ${e.message}", e)
                } finally {
                    if (zf != null) {
                        try { zf.close() } catch (Exception ignored) {}
                    }
                }
            }
        }

        // Within component: sort lexicographically
        candChangelogs.sort { a, b -> a.path <=> b.path }
        for (def item : candChangelogs) {
            if (seenNormalizedPaths.add(item.path)) {
                result.add(item)
            }
        }
    }

    return result
}

// 1.5. TD-2526: Host and dependency store names resolution
def parseStoreNames(Object rawValue) {
    if (rawValue == null) return []
    def str = rawValue.toString().trim()
    if (str.isEmpty()) return []
    if (str.contains('${')) {
        return [str]
    }
    return str.split(',').collect { it.trim() }.findAll { !it.isEmpty() }
}

def collectStoreNamesFromClasspathModuleProperties(Iterable<File> classpathFiles) {
    Set<String> names = new LinkedHashSet<>()
    if (classpathFiles == null) return names
    for (File f : classpathFiles) {
        if (f == null || !f.exists()) continue
        if (f.isDirectory()) {
            f.eachFileRecurse { child ->
                if (child.isFile() && child.name == 'module.properties') {
                    try {
                        def props = new Properties()
                        child.withInputStream { props.load(it) }
                        def val = props.getProperty('jmix.core.additional-stores')
                        if (val != null) {
                            names.addAll(parseStoreNames(val))
                        }
                    } catch (Exception e) {
                        println "::warning::[TD-2526] Failed to read module.properties from ${child.absolutePath}: ${e.message}"
                    }
                }
            }
        } else if (f.isFile() && (f.name.endsWith('.jar') || f.name.endsWith('.zip'))) {
            java.util.zip.ZipFile zip = null
            try {
                zip = new java.util.zip.ZipFile(f)
                def entries = zip.entries()
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    if (!entry.isDirectory() && (entry.name == 'module.properties' || entry.name.endsWith('/module.properties'))) {
                        try {
                            zip.getInputStream(entry).withStream { is ->
                                def props = new Properties()
                                props.load(is)
                                def val = props.getProperty('jmix.core.additional-stores')
                                if (val != null) {
                                    names.addAll(parseStoreNames(val))
                                }
                            }
                        } catch (Exception e) {
                            println "::warning::[TD-2526] Failed to read ${entry.name} from ${f.absolutePath}: ${e.message}"
                        }
                    }
                }
            } catch (Exception e) {
                println "::warning::[TD-2526] Failed to inspect archive ${f.absolutePath}: ${e.message}"
            } finally {
                if (zip != null) {
                    try { zip.close() } catch (Exception ignored) {}
                }
            }
        }
    }
    return names
}

def collectStoreNamesFromDependencyProperties(File classesDir) {
    Set<String> names = new LinkedHashSet<>()
    if (classesDir == null || !classesDir.exists() || !classesDir.isDirectory()) {
        return names
    }
    classesDir.eachFileRecurse { f ->
        if (f.isFile() && f.name.endsWith('.properties')) {
            try {
                def props = new Properties()
                f.withInputStream { props.load(it) }
                def val = props.getProperty('jmix.core.additional-stores')
                if (val != null) {
                    names.addAll(parseStoreNames(val))
                }
            } catch (Exception e) {
                println "::warning::[TD-2526] Failed to read properties file ${f.absolutePath}: ${e.message}"
            }
        }
    }
    return names
}

// 2.1. Isolated publication javaMavenTests (<artifactId>-tests)
gradle.allprojects { p ->
    p.pluginManager.withPlugin('maven-publish') {
        p.pluginManager.withPlugin('java') {
            // Target library modules only: not ending in -starter, -test, -app
            if (p.name.endsWith('-starter') || p.name.endsWith('-test') || p.name.endsWith('-app')) {
                return
            }
            if (!p.subprojects.isEmpty()) {
                return
            }

            // GMM is strictly disabled fleet-wide
            p.tasks.withType(GenerateModuleMetadata).configureEach {
                enabled = false
            }

            // Register afterEvaluate to inspect javaMaven publication after user build script evaluation
            p.afterEvaluate {
                if (p.state.failure != null) {
                    return
                }
                def publishing = p.extensions.findByType(PublishingExtension)
                if (publishing == null) {
                    return
                }

                def javaMaven = publishing.publications.findByName('javaMaven') as MavenPublication
                if (javaMaven == null) {
                    throw new GradleException("Could not find 'javaMaven' publication in project '${p.path}' for registering javaMavenTests")
                }

                def mainArtifactId = javaMaven.artifactId ?: (p.pluginManager.hasPlugin('base') ? p.base.archivesName.orNull : p.name)
                if (!mainArtifactId || mainArtifactId.trim().isEmpty()) {
                    throw new GradleException("ArtifactId in 'javaMaven' publication of project '${p.path}' is empty")
                }

                // Register testJar task
                def testJarTask = p.tasks.maybeCreate('testJar', Jar)
                testJarTask.archiveBaseName.set("${mainArtifactId}-tests")
                testJarTask.archiveClassifier.set('')
                testJarTask.from(p.sourceSets.test.output)

                // Task to generate META-INF/thedevs-test.properties descriptor
                def generateTestProperties = p.tasks.maybeCreate('generateAddonTestProperties')
                def testClassesTask = p.tasks.findByName('testClasses')
                if (testClassesTask != null) {
                    generateTestProperties.dependsOn(testClassesTask)
                }
                generateTestProperties.inputs.files(p.sourceSets.test.output.classesDirs)
                def testTask = p.tasks.findByName('test')
                if (testTask instanceof Test) {
                    generateTestProperties.inputs.property("testSystemProperties", {
                        testTask.systemProperties.toString()
                    })
                }
                def generatedDir = p.layout.buildDirectory.dir("generated/thedevs-test/META-INF").get().asFile
                generateTestProperties.outputs.dir(generatedDir)
                generateTestProperties.doLast {
                    generatedDir.mkdirs()
                    def propsFile = new File(generatedDir, "thedevs-test.properties")
                    def props = new Properties()

                    boolean hasTestClasses = false
                    p.sourceSets.test.output.classesDirs.each { dir ->
                        if (dir.exists()) {
                            dir.eachFileRecurse { f ->
                                if (f.isFile() && f.name.endsWith('.class')) {
                                    hasTestClasses = true
                                }
                            }
                        }
                    }

                    if (!hasTestClasses) {
                        props.setProperty('thedevs.tests.disabled', 'true')
                    } else {
                        props.setProperty('thedevs.tests.disabled', 'false')
                        props.setProperty('thedevs.test.systemProperties.liquibase.duplicateFileMode', 'WARN')

                        if (testTask instanceof Test) {
                            testTask.systemProperties.each { k, v ->
                                if (v != null) {
                                    props.setProperty("thedevs.test.systemProperties.${k}", v.toString())
                                }
                            }
                        }

                        String changelogPath = resolveProjectTestLiquibaseChangelog(p)
                        if (changelogPath != null) {
                            props.setProperty('thedevs.test.liquibase.change-log', changelogPath)
                        } else {
                            println "::warning::[TD-2039] Could not determine Liquibase changelog for '${p.path}' during testJar generation"
                        }
                    }

                    propsFile.withOutputStream { os ->
                        props.store(os, "Generated by ci-addon-tests.init.gradle for TD-2039")
                    }
                }

                testJarTask.dependsOn(generateTestProperties)
                testJarTask.from(p.layout.buildDirectory.dir("generated/thedevs-test"))

                // Register javaMavenTests publication
                if (publishing.publications.findByName('javaMavenTests') == null) {
                    publishing.publications.create('javaMavenTests', MavenPublication) { pub ->
                        pub.groupId = p.group.toString()
                        pub.artifactId = "${mainArtifactId}-tests"
                        pub.version = p.version.toString()
                        pub.artifact(testJarTask)

                        pub.pom.withXml { xml ->
                            def rootNode = xml.asNode()
                            def dependenciesNode = rootNode.children().find {
                                it instanceof groovy.util.Node && it.name()?.toString()?.endsWith('dependencies')
                            }
                            if (dependenciesNode == null) {
                                dependenciesNode = rootNode.appendNode('dependencies')
                            }

                            // 1. Dependency on the main module itself
                            def mainDepNode = dependenciesNode.appendNode('dependency')
                            mainDepNode.appendNode('groupId', p.group.toString())
                            mainDepNode.appendNode('artifactId', mainArtifactId)
                            mainDepNode.appendNode('version', p.version.toString())
                            mainDepNode.appendNode('scope', 'compile')

                            // 2. Test runtime dependencies from resolution result
                            def testRuntime = p.configurations.findByName('testRuntimeClasspath')
                            if (testRuntime != null) {
                                def resolutionResult = testRuntime.incoming.resolutionResult
                                def seenCoordinates = new HashSet<String>()
                                seenCoordinates.add("${p.group}:${mainArtifactId}")

                                resolutionResult.allComponents.each { comp ->
                                    if (comp == resolutionResult.root) return

                                    // Exclude platforms by Category attribute
                                    boolean isPlatform = comp.variants.any { v ->
                                        try {
                                            def cat = v.attributes.getAttribute(Category.CATEGORY_ATTRIBUTE)
                                            return cat != null && (cat.name == Category.REGULAR_PLATFORM ||
                                                                   cat.name == Category.ENFORCED_PLATFORM)
                                        } catch (Exception ignored) {
                                            return false
                                        }
                                    }
                                    if (isPlatform) return

                                    if (comp.id instanceof ModuleComponentIdentifier) {
                                        def mid = comp.id as ModuleComponentIdentifier
                                        def coordKey = "${mid.group}:${mid.module}"
                                        if (seenCoordinates.add(coordKey)) {
                                            def depNode = dependenciesNode.appendNode('dependency')
                                            depNode.appendNode('groupId', mid.group)
                                            depNode.appendNode('artifactId', mid.module)
                                            depNode.appendNode('version', mid.version)
                                            depNode.appendNode('scope', 'runtime')

                                            // Wildcard exclusions to keep flattened closure exactly identical
                                            def exclusionsNode = depNode.appendNode('exclusions')
                                            def exclNode = exclusionsNode.appendNode('exclusion')
                                            exclNode.appendNode('groupId', '*')
                                            exclNode.appendNode('artifactId', '*')
                                        }
                                    } else if (comp.id instanceof ProjectComponentIdentifier) {
                                        def pid = comp.id as ProjectComponentIdentifier
                                        def subproject = p.rootProject.findProject(pid.projectPath)
                                        if (subproject != null && subproject != p) {
                                            def subPub = subproject.extensions.findByType(PublishingExtension)?.publications?.findByName('javaMaven') as MavenPublication
                                            def subArtifactId = subPub?.artifactId ?: (subproject.pluginManager.hasPlugin('base') ? subproject.base.archivesName.orNull : subproject.name)
                                            def subGroup = subproject.group?.toString() ?: p.group.toString()
                                            def subVersion = subproject.version?.toString() ?: p.version.toString()
                                            def coordKey = "${subGroup}:${subArtifactId}"
                                            if (seenCoordinates.add(coordKey)) {
                                                def depNode = dependenciesNode.appendNode('dependency')
                                                depNode.appendNode('groupId', subGroup)
                                                depNode.appendNode('artifactId', subArtifactId)
                                                depNode.appendNode('version', subVersion)
                                                depNode.appendNode('scope', 'runtime')

                                                def projDep = (p.configurations.findByName('testImplementation')?.dependencies?.withType(ProjectDependency) ?: [])
                                                    .find { it.path == subproject.path }
                                                if (projDep != null && !projDep.excludeRules.isEmpty()) {
                                                    def exclusionsNode = depNode.appendNode('exclusions')
                                                    projDep.excludeRules.each { rule ->
                                                        def exclNode = exclusionsNode.appendNode('exclusion')
                                                        exclNode.appendNode('groupId', rule.group ?: '*')
                                                        exclNode.appendNode('artifactId', rule.module ?: '*')
                                                    }
                                                } else {
                                                    def exclusionsNode = depNode.appendNode('exclusions')
                                                    def exclNode = exclusionsNode.appendNode('exclusion')
                                                    exclNode.appendNode('groupId', '*')
                                                    exclNode.appendNode('artifactId', '*')
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

// 2.2 - 2.5. Dependency resolution, starter mapping and isolated testAddon_* tasks in gradle.projectsEvaluated
gradle.projectsEvaluated {
    gradle.allprojects { p ->
        if (!p.pluginManager.hasPlugin('java')) return
        if (p.name.endsWith('-starter') || p.name.endsWith('-test') || p.name.endsWith('-app')) return
        if (!p.subprojects.isEmpty()) return

        def runtimeClasspath = p.configurations.findByName('runtimeClasspath')
        if (runtimeClasspath == null) return

        def testAddonDependencies = p.tasks.maybeCreate('testAddonDependencies')
        testAddonDependencies.group = 'verification'
        testAddonDependencies.description = 'Runs tests of all direct ru.thedevs platform dependencies'

        def checkTask = p.tasks.findByName('check')
        if (checkTask != null) {
            checkTask.dependsOn(testAddonDependencies)
        }

        def candidateAddons = new LinkedHashSet<Map<String, String>>()
        def rootDeps = runtimeClasspath.incoming.resolutionResult.root.dependencies

        rootDeps.each { depResult ->
            if (!(depResult instanceof ResolvedDependencyResult)) return
            def resolvedDep = depResult as ResolvedDependencyResult
            if (resolvedDep.constraint) return

            def selected = resolvedDep.selected
            if (selected.id instanceof ProjectComponentIdentifier) return

            def depGroup = selected.moduleVersion?.group ?: ''
            if (!depGroup.startsWith('ru.thedevs')) return

            def depName = selected.moduleVersion?.name ?: ''
            if (depName.endsWith('-test') || depName.endsWith('-app')) return

            boolean isPlatform = selected.variants.any { v ->
                try {
                    def cat = v.attributes.getAttribute(Category.CATEGORY_ATTRIBUTE)
                    return cat != null && (cat.name == Category.REGULAR_PLATFORM ||
                                           cat.name == Category.ENFORCED_PLATFORM)
                } catch (Exception ignored) {
                    return false
                }
            }
            if (isPlatform) return

            def depVersion = selected.moduleVersion?.version ?: ''

            String baseModule = depName
            String baseGroup = depGroup
            String baseVersion = depVersion

            // Starter mapping: inspect outgoing dependencies
            if (depName.endsWith('-starter')) {
                def childDep = selected.dependencies.find { childResult ->
                    if (childResult instanceof ResolvedDependencyResult) {
                        def childSelected = (childResult as ResolvedDependencyResult).selected
                        def childGroup = childSelected.moduleVersion?.group ?: ''
                        def childName = childSelected.moduleVersion?.name ?: ''
                        def childVer = childSelected.moduleVersion?.version ?: ''
                        return childGroup == depGroup &&
                               childVer == depVersion &&
                               !childName.endsWith('-starter') &&
                               !childName.endsWith('-bom') &&
                               !childName.endsWith('-platform') &&
                               !childName.endsWith('-test') &&
                               !childName.endsWith('-app')
                    }
                    return false
                }
                if (childDep != null) {
                    def childMv = (childDep as ResolvedDependencyResult).selected.moduleVersion
                    baseGroup = childMv.group
                    baseModule = childMv.name
                    baseVersion = childMv.version
                } else {
                    baseModule = depName.substring(0, depName.length() - '-starter'.length())
                }
            }

            candidateAddons.add([group: baseGroup, baseModule: baseModule, version: baseVersion])
        }

        candidateAddons.each { addon ->
            def depGroup = addon.group
            def baseModule = addon.baseModule
            def depVersion = addon.version

            // 1. Create configuration addonTestClasspath_${baseModule}
            def confName = "addonTestClasspath_${baseModule}"
            def addonTestClasspath = p.configurations.maybeCreate(confName)
            addonTestClasspath.canBeConsumed = false
            addonTestClasspath.canBeResolved = true
            addonTestClasspath.transitive = true
            addonTestClasspath.shouldResolveConsistentlyWith(runtimeClasspath)
            p.dependencies.add(confName, "${depGroup}:${baseModule}-tests:${depVersion}")

            def testTaskName = "testAddon_${baseModule}"
            def testAddon = p.tasks.maybeCreate(testTaskName, Test)
            testAddon.group = 'verification'
            testAddon.description = "Runs tests of dependency ${depGroup}:${baseModule}"

            // 2. Unpack task and aggregate changelog generation
            def unpackTaskName = "unpackAddonTests_${baseModule}"
            def classesDir = p.layout.buildDirectory.dir("addon-tests/${baseModule}/classes").get().asFile
            def aggregateFile = p.layout.buildDirectory.file("addon-tests/${baseModule}/aggregate-changelog.xml").get().asFile

            def unpackTask = p.tasks.maybeCreate(unpackTaskName)
            unpackTask.inputs.files(addonTestClasspath.incoming.artifactView {
                lenient(true)
            }.files)
            unpackTask.inputs.files(runtimeClasspath)
            unpackTask.inputs.files({
                def hc = resolveHostMainLiquibaseChangelog(p)
                (hc != null && hc.file != null) ? p.files(hc.file) : p.files()
            })
            unpackTask.inputs.property("strictMode", {
                (p.findProperty('thedevs.tests.strict') == 'true') ||
                (p.providers.gradleProperty('thedevs.tests.strict').orNull == 'true') ||
                (System.getenv('THEDEVS_TESTS_STRICT') == 'true')
            })
            unpackTask.inputs.property("hostChangelog", {
                resolveHostMainLiquibaseChangelog(p)?.path ?: ''
            })
            unpackTask.outputs.dir(classesDir)
            unpackTask.outputs.file(aggregateFile)

            def testState = [testsDisabled: false, skippedPreRollout: false]

            unpackTask.doLast {
                classesDir.mkdirs()
                aggregateFile.parentFile.mkdirs()

                def isStrict = (p.findProperty('thedevs.tests.strict') == 'true') ||
                               (p.providers.gradleProperty('thedevs.tests.strict').orNull == 'true') ||
                               (System.getenv('THEDEVS_TESTS_STRICT') == 'true')

                def lenient = addonTestClasspath.resolvedConfiguration.lenientConfiguration
                def unresolved = lenient.unresolvedModuleDependencies

                // Match strictly the root selector
                def rootUnresolved = unresolved.find {
                    def sel = it.selector
                    def g = sel.hasProperty('group') ? sel.group : null
                    def n = sel.hasProperty('name') ? sel.name : (sel.hasProperty('module') ? sel.module : null)
                    def v = sel.hasProperty('version') ? sel.version : null
                    return g == depGroup && n == "${baseModule}-tests" && v == depVersion
                }

                if (rootUnresolved != null) {
                    def prob = rootUnresolved.problem
                    // Check cause chain for network / auth errors
                    def allCauses = []
                    def cur = prob
                    while (cur != null && !allCauses.contains(cur)) {
                        allCauses.add(cur)
                        cur = cur.cause
                    }

                    boolean isNetworkOrAuthError = allCauses.any { t ->
                        def cName = t.class.name
                        def cMsg = t.message ?: ''
                        return cName.contains("HttpError") ||
                               cName.contains("HttpResponseException") ||
                               cName.contains("ConnectException") ||
                               cName.contains("SocketException") ||
                               cName.contains("SocketTimeoutException") ||
                               cName.contains("UnknownHostException") ||
                               cName.contains("SSLException") ||
                               cMsg.contains("401 Unauthorized") ||
                               cMsg.contains("403 Forbidden") ||
                               cMsg.contains("500 Internal") ||
                               cMsg.contains("502 Bad Gateway") ||
                               cMsg.contains("503 Service") ||
                               cMsg.contains("504 Gateway") ||
                               cMsg.contains("Connection refused") ||
                               cMsg.contains("timed out")
                    }

                    if (isNetworkOrAuthError) {
                        throw new GradleException("[TD-2039] Network or repository error resolving '${depGroup}:${baseModule}-tests:${depVersion}': ${prob?.message}", prob)
                    }

                    boolean isNotFound = allCauses.any { t ->
                        def cName = t.class.name
                        def cMsg = t.message ?: ''
                        return cName.contains("ModuleVersionNotFoundException") ||
                               cMsg.startsWith("Could not find ${depGroup}:${baseModule}-tests") ||
                               cMsg.startsWith("Could not find ")
                    }

                    if (!isNotFound) {
                        throw new GradleException("[TD-2039] Resolution error for '${depGroup}:${baseModule}-tests:${depVersion}': ${prob?.message}", prob)
                    }

                    if (isStrict) {
                        throw new GradleException("[TD-2039] Strict mode enabled: tests artifact '${depGroup}:${baseModule}-tests:${depVersion}' was not found. Tests artifact must be published or marked with thedevs.tests.disabled=true in the descriptor.")
                    } else {
                        println "::warning::[TD-2039] Skipped dependency tests for '${depGroup}:${baseModule}': tests artifact not yet published (pre-rollout)."
                        testState.skippedPreRollout = true
                        testAddon.enabled = false
                        return
                    }
                }

                if (!unresolved.isEmpty()) {
                    throw new GradleException("[TD-2039] Failed to resolve transitive dependencies for '${depGroup}:${baseModule}-tests:${depVersion}': ${unresolved.collect { it.selector }.join(', ')}")
                }

                def testsJarArtifact = addonTestClasspath.resolvedConfiguration.resolvedArtifacts.find { art ->
                    art.name == "${baseModule}-tests" || art.file.name.startsWith("${baseModule}-tests-") || art.file.name == "${baseModule}-tests.jar"
                }

                if (testsJarArtifact == null || !testsJarArtifact.file.exists()) {
                    if (isStrict) {
                        throw new GradleException("[TD-2039] Strict mode enabled: tests artifact jar '${depGroup}:${baseModule}-tests:${depVersion}' not found.")
                    } else {
                        println "::warning::[TD-2039] Skipped dependency tests for '${depGroup}:${baseModule}': tests artifact not yet published (pre-rollout)."
                        testState.skippedPreRollout = true
                        testAddon.enabled = false
                        return
                    }
                }

                // Sync classes cleanly to eliminate stale files
                p.sync {
                    from p.zipTree(testsJarArtifact.file)
                    into classesDir
                }

                def propFile = new File(classesDir, "META-INF/thedevs-test.properties")
                def depProps = new Properties()
                if (propFile.exists()) {
                    propFile.withInputStream { depProps.load(it) }
                }

                if ('true'.equalsIgnoreCase(depProps.getProperty('thedevs.tests.disabled'))) {
                    println "[TD-2039] Dependency '${depGroup}:${baseModule}' marked with thedevs.tests.disabled=true. No tests to run."
                    testState.testsDisabled = true
                    testAddon.enabled = false
                }

                def depChangelog = depProps.getProperty('thedevs.test.liquibase.change-log') ?: depProps.getProperty('main.liquibase.change-log')
                def hostChangelogInfo = resolveHostMainLiquibaseChangelog(p)
                def hostChangelog = hostChangelogInfo?.path
                def hostChangelogFile = hostChangelogInfo?.file

                if (depChangelog == null) {
                    println "::warning::[TD-2039] Could not determine Liquibase changelog for dependency '${baseModule}'"
                }
                if (hostChangelog == null) {
                    println "::warning::[TD-2039] Could not determine host Liquibase changelog for project '${p.path}'"
                }

                boolean hostAlreadyIncludesDep = false
                if (hostChangelogFile != null && hostChangelogFile.exists() && depChangelog != null) {
                    def hostText = hostChangelogFile.text
                    def depNorm = depChangelog.startsWith('/') ? depChangelog.substring(1) : depChangelog
                    if (hostText.contains(depChangelog) || hostText.contains(depNorm) || hostText.contains("/" + depNorm)) {
                        hostAlreadyIncludesDep = true
                    }
                }

                def moduleChangelogs = resolveModuleLiquibaseChangelogs(p)

                def normDepChangelog = normalizeLiquibasePath(depChangelog)
                def normHostChangelog = normalizeLiquibasePath(hostChangelog)

                boolean depMatchesModule = (normDepChangelog != null && moduleChangelogs.any { it.path == normDepChangelog })

                def xmlBuilder = new StringBuilder()
                xmlBuilder.append('<?xml version="1.0" encoding="UTF-8"?>\n')
                xmlBuilder.append('<databaseChangeLog\n')
                xmlBuilder.append('    xmlns="http://www.liquibase.org/xml/ns/dbchangelog"\n')
                xmlBuilder.append('    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"\n')
                xmlBuilder.append('    xsi:schemaLocation="http://www.liquibase.org/xml/ns/dbchangelog\n')
                xmlBuilder.append('        http://www.liquibase.org/xml/ns/dbchangelog/dbchangelog-latest.xsd">\n\n')

                xmlBuilder.append('    <property name="uuid.type" dbms="oracle" value="varchar2(32)"/>\n')
                xmlBuilder.append('    <property name="uuid.type" dbms="!oracle" value="uuid"/>\n')

                def recordedModulePaths = []
                String depPosition = depMatchesModule ? "topological" : "first"

                if (!depMatchesModule) {
                    if (depChangelog != null && !hostAlreadyIncludesDep) {
                        xmlBuilder.append("    <include file=\"${depChangelog}\" relativeToChangelogFile=\"false\"/>\n")
                    }
                    for (def mc : moduleChangelogs) {
                        if (mc.path == normHostChangelog) continue
                        xmlBuilder.append("    <include file=\"/${mc.path}\" relativeToChangelogFile=\"false\"/>\n")
                        recordedModulePaths.add("/${mc.path}".toString())
                    }
                } else {
                    for (def mc : moduleChangelogs) {
                        if (mc.path == normHostChangelog) continue
                        if (mc.path == normDepChangelog) {
                            if (!hostAlreadyIncludesDep) {
                                xmlBuilder.append("    <include file=\"/${mc.path}\" relativeToChangelogFile=\"false\"/>\n")
                                recordedModulePaths.add("/${mc.path}".toString())
                            }
                        } else {
                            xmlBuilder.append("    <include file=\"/${mc.path}\" relativeToChangelogFile=\"false\"/>\n")
                            recordedModulePaths.add("/${mc.path}".toString())
                        }
                    }
                }

                if (hostChangelog != null) {
                    xmlBuilder.append("    <include file=\"${hostChangelog}\" relativeToChangelogFile=\"false\"/>\n")
                }
                xmlBuilder.append('</databaseChangeLog>\n')
                aggregateFile.text = xmlBuilder.toString()

                println "[TD-2533] aggregate-changelog for '${baseModule}': dep changelog position=${depPosition}, module changelogs=${recordedModulePaths.join(', ')}"
            }

            // 3. Configure test task
            testAddon.dependsOn(unpackTask)
            testAddon.testClassesDirs = p.files(classesDir)

            def starterProject = p.rootProject.subprojects.find { sp ->
                sp.name.endsWith('-starter') && sp.configurations.any { c ->
                    c.dependencies.any { d -> (d instanceof ProjectDependency) && (d.path == p.path || d.name == p.name) }
                }
            } ?: p.rootProject.subprojects.find { it.name == "${p.name}-starter" } ?:
                 p.rootProject.subprojects.find { it.name.endsWith('-starter') }
            def starterClassesDirs = (starterProject != null && starterProject.pluginManager.hasPlugin('java')) ?
                starterProject.sourceSets.main.output.classesDirs : p.files()
            // Extra output dirs registered via sourceSets.main.output.dir(...), e.g. Jmix-generated persistence.xml/orm.xml
            def starterGeneratedDirs = (starterProject != null && starterProject.pluginManager.hasPlugin('java')) ?
                starterProject.sourceSets.main.output.dirs : p.files()

            // 4. Persistence unit overlay generation (TD-2521)
            def overlayDir = p.layout.buildDirectory.dir("addon-tests/${baseModule}/persistence-overlay").get().asFile
            def overlayTaskName = "buildHostPersistenceOverlay_${baseModule}"
            def overlayTask = p.tasks.maybeCreate(overlayTaskName)
            overlayTask.inputs.files(p.sourceSets.main.output.dirs)
            overlayTask.inputs.files(starterGeneratedDirs)
            overlayTask.inputs.files(classesDir)
            overlayTask.inputs.files(addonTestClasspath.incoming.artifactView { lenient(true) }.files)
            overlayTask.outputs.dir(overlayDir)
            overlayTask.dependsOn(unpackTask)
            testAddon.dependsOn(overlayTask)

            overlayTask.doLast {
                overlayDir.deleteDir()
                if (testState.skippedPreRollout || testState.testsDisabled) {
                    return
                }

                // 1. Host Descriptors
                def hostOutputDirs = []
                hostOutputDirs.addAll(p.sourceSets.main.output.dirs.files)
                hostOutputDirs.addAll(starterGeneratedDirs.files)
                hostOutputDirs = hostOutputDirs.findAll { it != null && it.exists() && it.isDirectory() }

                // storeFileName -> [classes: Set, mappingFiles: Set, properties: Map, converters: Set, hostOrmClasses: Set]
                def hostDescriptorsByFileName = new LinkedHashMap<String, Map>()

                hostOutputDirs.each { dir ->
                    dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                        if (f.name == 'persistence.xml' || f.name.endsWith('-persistence.xml')) {
                            def storeName = f.name
                            def storeInfo = hostDescriptorsByFileName.computeIfAbsent(storeName, { k ->
                                [
                                    classes: new LinkedHashSet<String>(),
                                    mappingFiles: new LinkedHashSet<String>(),
                                    properties: new LinkedHashMap<String, String>(),
                                    converters: new LinkedHashSet<String>(),
                                    hostOrmClasses: new LinkedHashSet<String>()
                                ]
                            })

                            try {
                                def doc = f.withInputStream { is -> createSafeDocumentBuilder().parse(is) }
                                storeInfo.classes.addAll(textValues(doc.documentElement, "class"))
                                storeInfo.mappingFiles.addAll(textValues(doc.documentElement, "mapping-file"))

                                def propNodes = doc.getElementsByTagName("property")
                                for (int i = 0; i < propNodes.length; i++) {
                                    def pEl = propNodes.item(i) as Element
                                    def name = pEl.getAttribute("name")
                                    def val = pEl.getAttribute("value")
                                    if (name) {
                                        if (!storeInfo.properties.containsKey(name)) {
                                            storeInfo.properties.put(name, val)
                                        }
                                        if (name == 'io.jmix.enhancing.converters-list' && val) {
                                            val.split(';').each { c ->
                                                def trimmed = c.trim()
                                                if (!trimmed.isEmpty()) storeInfo.converters.add(trimmed)
                                            }
                                        }
                                    }
                                }
                            } catch (Exception e) {
                                println "::warning::[TD-2521] Failed to parse host descriptor '${f}': ${e.message}"
                            }
                        }
                    }
                }

                int totalHostClasses = hostDescriptorsByFileName.values().collect { it.classes.size() }.sum() ?: 0
                if (totalHostClasses == 0) {
                    return
                }

                hostDescriptorsByFileName.each { storeName, storeInfo ->
                    storeInfo.mappingFiles.each { mfPath ->
                        File hostOrmFile = hostOutputDirs.collect { new File(it, mfPath) }.find { it.exists() && it.isFile() }
                        if (hostOrmFile != null) {
                            try {
                                def ormDoc = hostOrmFile.withInputStream { is -> createSafeDocumentBuilder().parse(is) }
                                def root = ormDoc.documentElement
                                def children = root.childNodes
                                for (int i = 0; i < children.length; i++) {
                                    def child = children.item(i)
                                    if (child.nodeType == Node.ELEMENT_NODE) {
                                        def el = child as Element
                                        def tag = localXmlTag(el)
                                        if (['entity', 'mapped-superclass', 'embeddable'].contains(tag)) {
                                            def cls = el.getAttribute('class')?.trim()
                                            if (cls) storeInfo.hostOrmClasses.add(cls)
                                        }
                                    }
                                }
                            } catch (Exception e) {
                                println "::warning::[TD-2521] Failed to parse host mapping file '${hostOrmFile}': ${e.message}"
                            }
                        }
                    }
                }

                // 2. Candidate Roots in Dependency (classpath order)
                def depRoots = []
                if (classesDir.exists() && classesDir.isDirectory()) {
                    depRoots.add([type: 'dir', file: classesDir])
                }
                try {
                    def artifactGroupMap = [:]
                    addonTestClasspath.resolvedConfiguration.resolvedArtifacts.each { art ->
                        artifactGroupMap[art.file.absolutePath] = art.moduleVersion?.id?.group ?: ''
                    }
                    addonTestClasspath.files.each { f ->
                        def grp = artifactGroupMap[f.absolutePath] ?: ''
                        if (grp.startsWith('ru.thedevs') && f.exists() && f.isFile() && f.name.endsWith('.jar')) {
                            depRoots.add([type: 'jar', file: f])
                        }
                    }
                } catch (Exception e) {
                    println "::warning::[TD-2521] Could not resolve artifact groups for candidate roots: ${e.message}"
                }

                def candidatesByRelPath = new LinkedHashMap<String, Map>()
                depRoots.each { root ->
                    if (root.type == 'dir') {
                        root.file.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                            String rel = root.file.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                            if (!rel.startsWith('META-INF/') && (f.name == 'persistence.xml' || f.name.endsWith('-persistence.xml'))) {
                                if (!candidatesByRelPath.containsKey(rel)) {
                                    candidatesByRelPath.put(rel, [relPath: rel, fileName: f.name, root: root])
                                }
                            }
                        }
                    } else if (root.type == 'jar') {
                        def zf = new ZipFile(root.file)
                        try {
                            def entries = zf.entries()
                            while (entries.hasMoreElements()) {
                                def entry = entries.nextElement()
                                if (!entry.isDirectory()) {
                                    String rel = entry.name.replace('\\', '/')
                                    String entryFileName = rel.substring(rel.lastIndexOf('/') + 1)
                                    if (!rel.startsWith('META-INF/') && (entryFileName == 'persistence.xml' || entryFileName.endsWith('-persistence.xml'))) {
                                        if (!candidatesByRelPath.containsKey(rel)) {
                                            candidatesByRelPath.put(rel, [relPath: rel, fileName: entryFileName, root: root])
                                        }
                                    }
                                }
                            }
                        } finally {
                            zf.close()
                        }
                    }
                }

                def matchingCandidates = candidatesByRelPath.findAll { rel, cand ->
                    hostDescriptorsByFileName.containsKey(cand.fileName)
                }

                if (matchingCandidates.isEmpty()) {
                    println "::warning::[TD-2521] Host descriptors with entities exist, but no candidate persistence.xml found in dependency '${baseModule}'. Overlay not created."
                    return
                }

                def withResourceInputStream = { String resourcePath, Closure consumer ->
                    for (root in depRoots) {
                        if (root.type == 'dir') {
                            def f = new File(root.file, resourcePath)
                            if (f.exists() && f.isFile()) {
                                return f.withInputStream { is -> consumer(is) }
                            }
                        } else if (root.type == 'jar') {
                            def zf = new ZipFile(root.file)
                            try {
                                def entry = zf.getEntry(resourcePath)
                                if (entry != null && !entry.isDirectory()) {
                                    return zf.getInputStream(entry).withStream { is -> consumer(is) }
                                }
                            } finally {
                                zf.close()
                            }
                        }
                    }
                    return null
                }

                // 3 & 4. Merge candidates and create shadowing copies of mapping files
                def processedMappingFiles = new LinkedHashSet<String>()

                matchingCandidates.each { candidateRelPath, cand ->
                    def storeName = cand.fileName
                    def hostInfo = hostDescriptorsByFileName[storeName]

                    Document doc = null
                    try {
                        doc = withResourceInputStream(candidateRelPath) { is ->
                            createSafeDocumentBuilder().parse(is)
                        }
                    } catch (Exception e) {
                        println "::warning::[TD-2521] Failed to parse candidate descriptor '${candidateRelPath}': ${e.message}"
                        return
                    }
                    if (doc == null) return

                    def puNodes = doc.getElementsByTagName("persistence-unit")
                    if (puNodes.length == 0) return
                    def pu = puNodes.item(0) as Element

                    def depClasses = textValues(pu, "class")
                    def depMappingFiles = textValues(pu, "mapping-file")

                    def mfInsertBeforeTags = ['jar-file', 'class', 'exclude-unlisted-classes', 'shared-cache-mode', 'validation-mode', 'properties']
                    hostInfo.mappingFiles.each { hostMf ->
                        if (!depMappingFiles.contains(hostMf)) {
                            def newMf = doc.createElementNS(pu.namespaceURI, "mapping-file")
                            newMf.textContent = hostMf
                            def refNode = findInsertBefore(pu, mfInsertBeforeTags)
                            if (refNode != null) {
                                pu.insertBefore(newMf, refNode)
                            } else {
                                pu.appendChild(newMf)
                            }
                        }
                    }

                    def classInsertBeforeTags = ['exclude-unlisted-classes', 'shared-cache-mode', 'validation-mode', 'properties']
                    int addedHostClasses = 0
                    hostInfo.classes.each { hostCls ->
                        if (!depClasses.contains(hostCls)) {
                            def newCls = doc.createElementNS(pu.namespaceURI, "class")
                            newCls.textContent = hostCls
                            def refNode = findInsertBefore(pu, classInsertBeforeTags)
                            if (refNode != null) {
                                pu.insertBefore(newCls, refNode)
                            } else {
                                pu.appendChild(newCls)
                            }
                            addedHostClasses++
                        }
                    }

                    def propsNodes = pu.getElementsByTagName("properties")
                    Element propsEl
                    if (propsNodes.length > 0) {
                        propsEl = propsNodes.item(0) as Element
                    } else {
                        propsEl = doc.createElementNS(pu.namespaceURI, "properties")
                        pu.appendChild(propsEl)
                    }

                    def propElementsMap = new LinkedHashMap<String, Element>()
                    def existingPropNodes = propsEl.getElementsByTagName("property")
                    for (int i = 0; i < existingPropNodes.length; i++) {
                        def pEl = existingPropNodes.item(i) as Element
                        def pName = pEl.getAttribute("name")
                        if (pName) propElementsMap.put(pName, pEl)
                    }

                    if (hostInfo.converters.size() > 0 || propElementsMap.containsKey('io.jmix.enhancing.converters-list')) {
                        def convProp = propElementsMap['io.jmix.enhancing.converters-list']
                        def convList = new LinkedHashSet<String>()
                        if (convProp != null) {
                            def curVal = convProp.getAttribute('value') ?: ''
                            curVal.split(';').each { c ->
                                def trimmed = c.trim()
                                if (!trimmed.isEmpty()) convList.add(trimmed)
                            }
                        }
                        convList.addAll(hostInfo.converters)
                        def mergedConvVal = convList.join(';')
                        if (convProp != null) {
                            convProp.setAttribute('value', mergedConvVal)
                        } else {
                            def newProp = doc.createElementNS(pu.namespaceURI, "property")
                            newProp.setAttribute("name", "io.jmix.enhancing.converters-list")
                            newProp.setAttribute("value", mergedConvVal)
                            propsEl.appendChild(newProp)
                            propElementsMap.put("io.jmix.enhancing.converters-list", newProp)
                        }
                    }

                    hostInfo.properties.each { propName, propVal ->
                        if (propName != 'io.jmix.enhancing.converters-list' && !propElementsMap.containsKey(propName)) {
                            def newProp = doc.createElementNS(pu.namespaceURI, "property")
                            newProp.setAttribute("name", propName)
                            newProp.setAttribute("value", propVal)
                            propsEl.appendChild(newProp)
                            propElementsMap.put(propName, newProp)
                        }
                    }

                    def targetFile = new File(overlayDir, candidateRelPath)
                    writeXmlDocument(doc, targetFile)
                    println "[TD-2521] Persistence overlay for '${baseModule}': ${candidateRelPath} (+${addedHostClasses} host classes)"

                    // Shadowing copies of dependency mapping files
                    depMappingFiles.each { mappingFile ->
                        if (!processedMappingFiles.add(mappingFile)) {
                            return
                        }
                        if (hostInfo.mappingFiles.contains(mappingFile)) {
                            println "::warning::[TD-2521] Dependency mapping-file '${mappingFile}' collides with host mapping-file path. Skipping shadowing copy."
                            return
                        }

                        Document mfDoc = null
                        try {
                            mfDoc = withResourceInputStream(mappingFile) { is ->
                                createSafeDocumentBuilder().parse(is)
                            }
                        } catch (Exception e) {
                            println "::warning::[TD-2521] Failed to parse mapping-file '${mappingFile}': ${e.message}"
                            return
                        }

                        if (mfDoc == null) {
                            println "::warning::[TD-2521] Dependency mapping-file '${mappingFile}' not found in dependency roots. Skipping shadowing copy."
                            return
                        }

                        def mfRoot = mfDoc.documentElement
                        int removedCount = 0
                        def mfChildren = mfRoot.childNodes
                        for (int i = mfChildren.length - 1; i >= 0; i--) {
                            def ch = mfChildren.item(i)
                            if (ch.nodeType == Node.ELEMENT_NODE) {
                                def el = ch as Element
                                def tag = localXmlTag(el)
                                if (['entity', 'mapped-superclass', 'embeddable'].contains(tag)) {
                                    def cls = el.getAttribute('class')?.trim()
                                    if (cls && hostInfo.hostOrmClasses.contains(cls)) {
                                        mfRoot.removeChild(el)
                                        removedCount++
                                    }
                                }
                            }
                        }

                        def mfTargetFile = new File(overlayDir, mappingFile)
                        writeXmlDocument(mfDoc, mfTargetFile)
                        println "[TD-2521] Persistence overlay for '${baseModule}': ${mappingFile} (-${removedCount} entity entries superseded by host)"
                    }
                }
            }

            def mainResDir = p.layout.buildDirectory.dir("addon-tests/${baseModule}/host-resources/main")
            def filterHostMainResources = p.tasks.maybeCreate("filterHostMainResources_${baseModule}", Sync)
            filterHostMainResources.destinationDir = mainResDir.get().asFile
            filterHostMainResources.from(p.tasks.named('processResources'))
            filterHostMainResources.exclude 'META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports'
            testAddon.dependsOn(filterHostMainResources)

            def starterResDir = (starterProject != null && starterProject.pluginManager.hasPlugin('java')) ?
                p.layout.buildDirectory.dir("addon-tests/${baseModule}/host-resources/starter") : null
            if (starterResDir != null) {
                def filterHostStarterResources = p.tasks.maybeCreate("filterHostStarterResources_${baseModule}", Sync)
                filterHostStarterResources.destinationDir = starterResDir.get().asFile
                filterHostStarterResources.from(starterProject.tasks.named('processResources'))
                filterHostStarterResources.exclude 'META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports'
                testAddon.dependsOn(filterHostStarterResources)
            }

            def hostResourcesDirs = [mainResDir] + (starterResDir != null ? [starterResDir] : [])
            testAddon.classpath = p.files({
                if (testState.skippedPreRollout || testState.testsDisabled) {
                    return p.files()
                }
                boolean overlayHasFiles = overlayDir.exists() && !p.fileTree(overlayDir).isEmpty()
                def overlayFiles = overlayHasFiles ? p.files(overlayDir) : p.files()
                return overlayFiles +
                       p.files(classesDir, aggregateFile.parentFile, hostResourcesDirs) +
                       addonTestClasspath +
                       p.sourceSets.main.output.classesDirs +
                       p.sourceSets.main.output.dirs +
                       starterClassesDirs +
                       starterGeneratedDirs +
                       runtimeClasspath
            })

            testAddon.useJUnitPlatform {
                excludeTags 'hsql-pending'
            }
            testAddon.failOnNoDiscoveredTests = false
            testAddon.filter.failOnNoMatchingTests = false

            testAddon.reports.html.outputLocation.set(p.layout.buildDirectory.dir("reports/tests/${testTaskName}"))
            testAddon.reports.junitXml.outputLocation.set(p.layout.buildDirectory.dir("test-results/${testTaskName}"))

            testAddon.doFirst {
                if (testState.skippedPreRollout || testState.testsDisabled) {
                    testAddon.setTestClassesDirs(p.files())
                    return
                }

                def initialHostAdditionalStores = testAddon.systemProperties['jmix.core.additional-stores']
                def depDescriptorAdditionalStores = null

                def propFile = new File(classesDir, "META-INF/thedevs-test.properties")
                if (propFile.exists()) {
                    def depProps = new Properties()
                    propFile.withInputStream { depProps.load(it) }
                    depProps.each { k, v ->
                        if (k.startsWith('thedevs.test.systemProperties.')) {
                            def sysProp = k.substring('thedevs.test.systemProperties.'.length())
                            testAddon.systemProperty(sysProp, v)
                            if (sysProp == 'jmix.core.additional-stores') {
                                depDescriptorAdditionalStores = v
                            }
                        }
                    }
                }

                Set<String> allStores = new LinkedHashSet<>()
                allStores.addAll(parseStoreNames(initialHostAdditionalStores))
                allStores.addAll(parseStoreNames(depDescriptorAdditionalStores))
                allStores.addAll(collectStoreNamesFromDependencyProperties(classesDir))
                allStores.addAll(collectStoreNamesFromClasspathModuleProperties(testAddon.classpath.files))

                if (!allStores.isEmpty()) {
                    def joined = allStores.join(',')
                    testAddon.systemProperty('jmix.core.additional-stores', joined)
                    println "[TD-2526] testAddon_${baseModule}: jmix.core.additional-stores=${joined}"
                }

                testAddon.systemProperty('main.liquibase.change-log', 'classpath:aggregate-changelog.xml')
                testAddon.systemProperty('spring.liquibase.change-log', 'classpath:aggregate-changelog.xml')
                testAddon.systemProperty('liquibase.duplicateFileMode', 'WARN')
                testAddon.systemProperty('liquibase.allowDuplicatedChangesetIdentifiers', 'true')
                println "[TD-2533] testAddon_${baseModule}: liquibase.allowDuplicatedChangesetIdentifiers=true"
            }

            testAddonDependencies.dependsOn(testAddon)
        }
    }
}
