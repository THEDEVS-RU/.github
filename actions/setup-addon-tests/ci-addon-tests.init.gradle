// Canonical Gradle init script for TD-2039: CI Addon Tests Architecture
// Fleet-wide configuration for separate <artifactId>-tests publishing and isolated dependency test execution.

import org.gradle.api.GradleException
import org.gradle.api.Project
import org.gradle.api.artifacts.ProjectDependency
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.component.ProjectComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedDependencyResult
import org.gradle.api.attributes.Category
import org.gradle.api.publish.PublishingExtension
import org.gradle.api.publish.maven.MavenPublication
import org.gradle.api.publish.tasks.GenerateModuleMetadata
import org.gradle.api.tasks.Sync
import org.gradle.api.tasks.bundling.Jar
import org.gradle.api.tasks.testing.Test

def resolveProjectTestLiquibaseChangelog(Project p) {
    if (!p.pluginManager.hasPlugin('java')) return null

    // 1. From test task systemProperties
    def testTask = p.tasks.findByName('test')
    if (testTask instanceof Test) {
        def sysVal = testTask.systemProperties['main.liquibase.change-log'] ?: testTask.systemProperties['spring.liquibase.change-log']
        if (sysVal != null && !sysVal.toString().trim().isEmpty()) {
            return sysVal.toString().trim()
        }
    }

    // 2. From test resources property files (*.properties)
    for (File resDir : p.sourceSets.test.resources.srcDirs) {
        if (!resDir.exists()) continue
        def propFiles = []
        resDir.eachFileRecurse { f ->
            if (f.isFile() && f.name.endsWith('.properties')) {
                propFiles.add(f)
            }
        }
        for (File pf : propFiles) {
            def props = new Properties()
            try {
                pf.withInputStream { props.load(it) }
                def val = props.getProperty('main.liquibase.change-log') ?: props.getProperty('spring.liquibase.change-log')
                if (val != null && !val.trim().isEmpty()) {
                    return val.trim()
                }
            } catch (Exception ignored) {}
        }
    }

    // 3. From main resources changelog XML files
    for (File resDir : p.sourceSets.main.resources.srcDirs) {
        if (!resDir.exists()) continue
        File found = null
        resDir.eachFileRecurse { f ->
            if (f.isFile() && (f.name == 'changelog.xml' || f.name == 'master.xml') && f.parentFile?.name == 'liquibase') {
                if (found == null) found = f
            }
        }
        if (found != null) {
            return resDir.toPath().relativize(found.toPath()).toString().replace('\\', '/')
        }
    }

    // 4. From test resources changelog XML files
    for (File resDir : p.sourceSets.test.resources.srcDirs) {
        if (!resDir.exists()) continue
        File found = null
        resDir.eachFileRecurse { f ->
            if (f.isFile() && (f.name == 'changelog.xml' || f.name == 'master.xml') && f.parentFile?.name == 'liquibase') {
                if (found == null) found = f
            }
        }
        if (found != null) {
            return resDir.toPath().relativize(found.toPath()).toString().replace('\\', '/')
        }
    }

    return null
}

def resolveHostMainLiquibaseChangelog(Project p) {
    if (!p.pluginManager.hasPlugin('java')) return null
    File found = null
    File matchedResDir = null
    for (File resDir : p.sourceSets.main.resources.srcDirs) {
        if (!resDir.exists()) continue
        resDir.eachFileRecurse { f ->
            if (f.isFile() && (f.name == 'changelog.xml' || f.name == 'master.xml') && f.parentFile?.name == 'liquibase') {
                if (found == null) {
                    found = f
                    matchedResDir = resDir
                }
            }
        }
        if (found != null) break
    }
    if (found != null && matchedResDir != null) {
        def relPath = matchedResDir.toPath().relativize(found.toPath()).toString().replace('\\', '/')
        return [path: relPath, file: found]
    }
    return null
}

// 2.1. Isolated publication javaMavenTests (<artifactId>-tests)
gradle.allprojects { p ->
    p.pluginManager.withPlugin('maven-publish') {
        p.pluginManager.withPlugin('java') {
            // Target library modules only: not ending in -starter, -test, -app
            if (p.name.endsWith('-starter') || p.name.endsWith('-test') || p.name.endsWith('-app')) {
                return
            }
            if (!p.subprojects.isEmpty()) {
                return
            }

            // GMM is strictly disabled fleet-wide
            p.tasks.withType(GenerateModuleMetadata).configureEach {
                enabled = false
            }

            // Register afterEvaluate to inspect javaMaven publication after user build script evaluation
            p.afterEvaluate {
                if (p.state.failure != null) {
                    return
                }
                def publishing = p.extensions.findByType(PublishingExtension)
                if (publishing == null) {
                    return
                }

                def javaMaven = publishing.publications.findByName('javaMaven') as MavenPublication
                if (javaMaven == null) {
                    throw new GradleException("Could not find 'javaMaven' publication in project '${p.path}' for registering javaMavenTests")
                }

                def mainArtifactId = javaMaven.artifactId ?: (p.pluginManager.hasPlugin('base') ? p.base.archivesName.orNull : p.name)
                if (!mainArtifactId || mainArtifactId.trim().isEmpty()) {
                    throw new GradleException("ArtifactId in 'javaMaven' publication of project '${p.path}' is empty")
                }

                // Register testJar task
                def testJarTask = p.tasks.maybeCreate('testJar', Jar)
                testJarTask.archiveBaseName.set("${mainArtifactId}-tests")
                testJarTask.archiveClassifier.set('')
                testJarTask.from(p.sourceSets.test.output)

                // Task to generate META-INF/thedevs-test.properties descriptor
                def generateTestProperties = p.tasks.maybeCreate('generateAddonTestProperties')
                def testClassesTask = p.tasks.findByName('testClasses')
                if (testClassesTask != null) {
                    generateTestProperties.dependsOn(testClassesTask)
                }
                generateTestProperties.inputs.files(p.sourceSets.test.output.classesDirs)
                def testTask = p.tasks.findByName('test')
                if (testTask instanceof Test) {
                    generateTestProperties.inputs.property("testSystemProperties", {
                        testTask.systemProperties.toString()
                    })
                }
                def generatedDir = p.layout.buildDirectory.dir("generated/thedevs-test/META-INF").get().asFile
                generateTestProperties.outputs.dir(generatedDir)
                generateTestProperties.doLast {
                    generatedDir.mkdirs()
                    def propsFile = new File(generatedDir, "thedevs-test.properties")
                    def props = new Properties()

                    boolean hasTestClasses = false
                    p.sourceSets.test.output.classesDirs.each { dir ->
                        if (dir.exists()) {
                            dir.eachFileRecurse { f ->
                                if (f.isFile() && f.name.endsWith('.class')) {
                                    hasTestClasses = true
                                }
                            }
                        }
                    }

                    if (!hasTestClasses) {
                        props.setProperty('thedevs.tests.disabled', 'true')
                    } else {
                        props.setProperty('thedevs.tests.disabled', 'false')
                        props.setProperty('thedevs.test.systemProperties.liquibase.duplicateFileMode', 'WARN')

                        if (testTask instanceof Test) {
                            testTask.systemProperties.each { k, v ->
                                if (v != null) {
                                    props.setProperty("thedevs.test.systemProperties.${k}", v.toString())
                                }
                            }
                        }

                        String changelogPath = resolveProjectTestLiquibaseChangelog(p)
                        if (changelogPath != null) {
                            props.setProperty('thedevs.test.liquibase.change-log', changelogPath)
                        } else {
                            println "::warning::[TD-2039] Could not determine Liquibase changelog for '${p.path}' during testJar generation"
                        }
                    }

                    propsFile.withOutputStream { os ->
                        props.store(os, "Generated by ci-addon-tests.init.gradle for TD-2039")
                    }
                }

                testJarTask.dependsOn(generateTestProperties)
                testJarTask.from(p.layout.buildDirectory.dir("generated/thedevs-test"))

                // Register javaMavenTests publication
                if (publishing.publications.findByName('javaMavenTests') == null) {
                    publishing.publications.create('javaMavenTests', MavenPublication) { pub ->
                        pub.groupId = p.group.toString()
                        pub.artifactId = "${mainArtifactId}-tests"
                        pub.version = p.version.toString()
                        pub.artifact(testJarTask)

                        pub.pom.withXml { xml ->
                            def rootNode = xml.asNode()
                            def dependenciesNode = rootNode.children().find {
                                it instanceof groovy.util.Node && it.name()?.toString()?.endsWith('dependencies')
                            }
                            if (dependenciesNode == null) {
                                dependenciesNode = rootNode.appendNode('dependencies')
                            }

                            // 1. Dependency on the main module itself
                            def mainDepNode = dependenciesNode.appendNode('dependency')
                            mainDepNode.appendNode('groupId', p.group.toString())
                            mainDepNode.appendNode('artifactId', mainArtifactId)
                            mainDepNode.appendNode('version', p.version.toString())
                            mainDepNode.appendNode('scope', 'compile')

                            // 2. Test runtime dependencies from resolution result
                            def testRuntime = p.configurations.findByName('testRuntimeClasspath')
                            if (testRuntime != null) {
                                def resolutionResult = testRuntime.incoming.resolutionResult
                                def seenCoordinates = new HashSet<String>()
                                seenCoordinates.add("${p.group}:${mainArtifactId}")

                                resolutionResult.allComponents.each { comp ->
                                    if (comp == resolutionResult.root) return

                                    // Exclude platforms by Category attribute
                                    boolean isPlatform = comp.variants.any { v ->
                                        try {
                                            def cat = v.attributes.getAttribute(Category.CATEGORY_ATTRIBUTE)
                                            return cat != null && (cat.name == Category.REGULAR_PLATFORM ||
                                                                   cat.name == Category.ENFORCED_PLATFORM)
                                        } catch (Exception ignored) {
                                            return false
                                        }
                                    }
                                    if (isPlatform) return

                                    if (comp.id instanceof ModuleComponentIdentifier) {
                                        def mid = comp.id as ModuleComponentIdentifier
                                        def coordKey = "${mid.group}:${mid.module}"
                                        if (seenCoordinates.add(coordKey)) {
                                            def depNode = dependenciesNode.appendNode('dependency')
                                            depNode.appendNode('groupId', mid.group)
                                            depNode.appendNode('artifactId', mid.module)
                                            depNode.appendNode('version', mid.version)
                                            depNode.appendNode('scope', 'runtime')

                                            // Wildcard exclusions to keep flattened closure exactly identical
                                            def exclusionsNode = depNode.appendNode('exclusions')
                                            def exclNode = exclusionsNode.appendNode('exclusion')
                                            exclNode.appendNode('groupId', '*')
                                            exclNode.appendNode('artifactId', '*')
                                        }
                                    } else if (comp.id instanceof ProjectComponentIdentifier) {
                                        def pid = comp.id as ProjectComponentIdentifier
                                        def subproject = p.rootProject.findProject(pid.projectPath)
                                        if (subproject != null && subproject != p) {
                                            def subPub = subproject.extensions.findByType(PublishingExtension)?.publications?.findByName('javaMaven') as MavenPublication
                                            def subArtifactId = subPub?.artifactId ?: (subproject.pluginManager.hasPlugin('base') ? subproject.base.archivesName.orNull : subproject.name)
                                            def subGroup = subproject.group?.toString() ?: p.group.toString()
                                            def subVersion = subproject.version?.toString() ?: p.version.toString()
                                            def coordKey = "${subGroup}:${subArtifactId}"
                                            if (seenCoordinates.add(coordKey)) {
                                                def depNode = dependenciesNode.appendNode('dependency')
                                                depNode.appendNode('groupId', subGroup)
                                                depNode.appendNode('artifactId', subArtifactId)
                                                depNode.appendNode('version', subVersion)
                                                depNode.appendNode('scope', 'runtime')

                                                def projDep = (p.configurations.findByName('testImplementation')?.dependencies?.withType(ProjectDependency) ?: [])
                                                    .find { it.path == subproject.path }
                                                if (projDep != null && !projDep.excludeRules.isEmpty()) {
                                                    def exclusionsNode = depNode.appendNode('exclusions')
                                                    projDep.excludeRules.each { rule ->
                                                        def exclNode = exclusionsNode.appendNode('exclusion')
                                                        exclNode.appendNode('groupId', rule.group ?: '*')
                                                        exclNode.appendNode('artifactId', rule.module ?: '*')
                                                    }
                                                } else {
                                                    def exclusionsNode = depNode.appendNode('exclusions')
                                                    def exclNode = exclusionsNode.appendNode('exclusion')
                                                    exclNode.appendNode('groupId', '*')
                                                    exclNode.appendNode('artifactId', '*')
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}

// 2.2 - 2.5. Dependency resolution, starter mapping and isolated testAddon_* tasks in gradle.projectsEvaluated
gradle.projectsEvaluated {
    gradle.allprojects { p ->
        if (!p.pluginManager.hasPlugin('java')) return
        if (p.name.endsWith('-starter') || p.name.endsWith('-test') || p.name.endsWith('-app')) return
        if (!p.subprojects.isEmpty()) return

        def runtimeClasspath = p.configurations.findByName('runtimeClasspath')
        if (runtimeClasspath == null) return

        def testAddonDependencies = p.tasks.maybeCreate('testAddonDependencies')
        testAddonDependencies.group = 'verification'
        testAddonDependencies.description = 'Runs tests of all direct ru.thedevs platform dependencies'

        def checkTask = p.tasks.findByName('check')
        if (checkTask != null) {
            checkTask.dependsOn(testAddonDependencies)
        }

        def candidateAddons = new LinkedHashSet<Map<String, String>>()
        def rootDeps = runtimeClasspath.incoming.resolutionResult.root.dependencies

        rootDeps.each { depResult ->
            if (!(depResult instanceof ResolvedDependencyResult)) return
            def resolvedDep = depResult as ResolvedDependencyResult
            if (resolvedDep.constraint) return

            def selected = resolvedDep.selected
            if (selected.id instanceof ProjectComponentIdentifier) return

            def depGroup = selected.moduleVersion?.group ?: ''
            if (!depGroup.startsWith('ru.thedevs')) return

            def depName = selected.moduleVersion?.name ?: ''
            if (depName.endsWith('-test') || depName.endsWith('-app')) return

            boolean isPlatform = selected.variants.any { v ->
                try {
                    def cat = v.attributes.getAttribute(Category.CATEGORY_ATTRIBUTE)
                    return cat != null && (cat.name == Category.REGULAR_PLATFORM ||
                                           cat.name == Category.ENFORCED_PLATFORM)
                } catch (Exception ignored) {
                    return false
                }
            }
            if (isPlatform) return

            def depVersion = selected.moduleVersion?.version ?: ''

            String baseModule = depName
            String baseGroup = depGroup
            String baseVersion = depVersion

            // Starter mapping: inspect outgoing dependencies
            if (depName.endsWith('-starter')) {
                def childDep = selected.dependencies.find { childResult ->
                    if (childResult instanceof ResolvedDependencyResult) {
                        def childSelected = (childResult as ResolvedDependencyResult).selected
                        def childGroup = childSelected.moduleVersion?.group ?: ''
                        def childName = childSelected.moduleVersion?.name ?: ''
                        def childVer = childSelected.moduleVersion?.version ?: ''
                        return childGroup == depGroup &&
                               childVer == depVersion &&
                               !childName.endsWith('-starter') &&
                               !childName.endsWith('-bom') &&
                               !childName.endsWith('-platform') &&
                               !childName.endsWith('-test') &&
                               !childName.endsWith('-app')
                    }
                    return false
                }
                if (childDep != null) {
                    def childMv = (childDep as ResolvedDependencyResult).selected.moduleVersion
                    baseGroup = childMv.group
                    baseModule = childMv.name
                    baseVersion = childMv.version
                } else {
                    baseModule = depName.substring(0, depName.length() - '-starter'.length())
                }
            }

            candidateAddons.add([group: baseGroup, baseModule: baseModule, version: baseVersion])
        }

        candidateAddons.each { addon ->
            def depGroup = addon.group
            def baseModule = addon.baseModule
            def depVersion = addon.version

            // 1. Create configuration addonTestClasspath_${baseModule}
            def confName = "addonTestClasspath_${baseModule}"
            def addonTestClasspath = p.configurations.maybeCreate(confName)
            addonTestClasspath.canBeConsumed = false
            addonTestClasspath.canBeResolved = true
            addonTestClasspath.transitive = true
            addonTestClasspath.shouldResolveConsistentlyWith(runtimeClasspath)
            p.dependencies.add(confName, "${depGroup}:${baseModule}-tests:${depVersion}")

            def testTaskName = "testAddon_${baseModule}"
            def testAddon = p.tasks.maybeCreate(testTaskName, Test)
            testAddon.group = 'verification'
            testAddon.description = "Runs tests of dependency ${depGroup}:${baseModule}"

            // 2. Unpack task and aggregate changelog generation
            def unpackTaskName = "unpackAddonTests_${baseModule}"
            def classesDir = p.layout.buildDirectory.dir("addon-tests/${baseModule}/classes").get().asFile
            def aggregateFile = p.layout.buildDirectory.file("addon-tests/${baseModule}/aggregate-changelog.xml").get().asFile

            def unpackTask = p.tasks.maybeCreate(unpackTaskName)
            unpackTask.inputs.files(addonTestClasspath.incoming.artifactView {
                lenient(true)
            }.files)
            unpackTask.inputs.files({
                def hc = resolveHostMainLiquibaseChangelog(p)
                (hc != null && hc.file != null) ? p.files(hc.file) : p.files()
            })
            unpackTask.inputs.property("strictMode", {
                (p.findProperty('thedevs.tests.strict') == 'true') ||
                (p.providers.gradleProperty('thedevs.tests.strict').orNull == 'true') ||
                (System.getenv('THEDEVS_TESTS_STRICT') == 'true')
            })
            unpackTask.inputs.property("hostChangelog", {
                resolveHostMainLiquibaseChangelog(p)?.path ?: ''
            })
            unpackTask.outputs.dir(classesDir)
            unpackTask.outputs.file(aggregateFile)

            def testState = [testsDisabled: false, skippedPreRollout: false]

            unpackTask.doLast {
                classesDir.mkdirs()
                aggregateFile.parentFile.mkdirs()

                def isStrict = (p.findProperty('thedevs.tests.strict') == 'true') ||
                               (p.providers.gradleProperty('thedevs.tests.strict').orNull == 'true') ||
                               (System.getenv('THEDEVS_TESTS_STRICT') == 'true')

                def lenient = addonTestClasspath.resolvedConfiguration.lenientConfiguration
                def unresolved = lenient.unresolvedModuleDependencies

                // Match strictly the root selector
                def rootUnresolved = unresolved.find {
                    def sel = it.selector
                    def g = sel.hasProperty('group') ? sel.group : null
                    def n = sel.hasProperty('name') ? sel.name : (sel.hasProperty('module') ? sel.module : null)
                    def v = sel.hasProperty('version') ? sel.version : null
                    return g == depGroup && n == "${baseModule}-tests" && v == depVersion
                }

                if (rootUnresolved != null) {
                    def prob = rootUnresolved.problem
                    // Check cause chain for network / auth errors
                    def allCauses = []
                    def cur = prob
                    while (cur != null && !allCauses.contains(cur)) {
                        allCauses.add(cur)
                        cur = cur.cause
                    }

                    boolean isNetworkOrAuthError = allCauses.any { t ->
                        def cName = t.class.name
                        def cMsg = t.message ?: ''
                        return cName.contains("HttpError") ||
                               cName.contains("HttpResponseException") ||
                               cName.contains("ConnectException") ||
                               cName.contains("SocketException") ||
                               cName.contains("SocketTimeoutException") ||
                               cName.contains("UnknownHostException") ||
                               cName.contains("SSLException") ||
                               cMsg.contains("401 Unauthorized") ||
                               cMsg.contains("403 Forbidden") ||
                               cMsg.contains("500 Internal") ||
                               cMsg.contains("502 Bad Gateway") ||
                               cMsg.contains("503 Service") ||
                               cMsg.contains("504 Gateway") ||
                               cMsg.contains("Connection refused") ||
                               cMsg.contains("timed out")
                    }

                    if (isNetworkOrAuthError) {
                        throw new GradleException("[TD-2039] Network or repository error resolving '${depGroup}:${baseModule}-tests:${depVersion}': ${prob?.message}", prob)
                    }

                    boolean isNotFound = allCauses.any { t ->
                        def cName = t.class.name
                        def cMsg = t.message ?: ''
                        return cName.contains("ModuleVersionNotFoundException") ||
                               cMsg.startsWith("Could not find ${depGroup}:${baseModule}-tests") ||
                               cMsg.startsWith("Could not find ")
                    }

                    if (!isNotFound) {
                        throw new GradleException("[TD-2039] Resolution error for '${depGroup}:${baseModule}-tests:${depVersion}': ${prob?.message}", prob)
                    }

                    if (isStrict) {
                        throw new GradleException("[TD-2039] Strict mode enabled: tests artifact '${depGroup}:${baseModule}-tests:${depVersion}' was not found. Tests artifact must be published or marked with thedevs.tests.disabled=true in the descriptor.")
                    } else {
                        println "::warning::[TD-2039] Skipped dependency tests for '${depGroup}:${baseModule}': tests artifact not yet published (pre-rollout)."
                        testState.skippedPreRollout = true
                        testAddon.enabled = false
                        return
                    }
                }

                if (!unresolved.isEmpty()) {
                    throw new GradleException("[TD-2039] Failed to resolve transitive dependencies for '${depGroup}:${baseModule}-tests:${depVersion}': ${unresolved.collect { it.selector }.join(', ')}")
                }

                def testsJarArtifact = addonTestClasspath.resolvedConfiguration.resolvedArtifacts.find { art ->
                    art.name == "${baseModule}-tests" || art.file.name.startsWith("${baseModule}-tests-") || art.file.name == "${baseModule}-tests.jar"
                }

                if (testsJarArtifact == null || !testsJarArtifact.file.exists()) {
                    if (isStrict) {
                        throw new GradleException("[TD-2039] Strict mode enabled: tests artifact jar '${depGroup}:${baseModule}-tests:${depVersion}' not found.")
                    } else {
                        println "::warning::[TD-2039] Skipped dependency tests for '${depGroup}:${baseModule}': tests artifact not yet published (pre-rollout)."
                        testState.skippedPreRollout = true
                        testAddon.enabled = false
                        return
                    }
                }

                // Sync classes cleanly to eliminate stale files
                p.sync {
                    from p.zipTree(testsJarArtifact.file)
                    into classesDir
                }

                def propFile = new File(classesDir, "META-INF/thedevs-test.properties")
                def depProps = new Properties()
                if (propFile.exists()) {
                    propFile.withInputStream { depProps.load(it) }
                }

                if ('true'.equalsIgnoreCase(depProps.getProperty('thedevs.tests.disabled'))) {
                    println "[TD-2039] Dependency '${depGroup}:${baseModule}' marked with thedevs.tests.disabled=true. No tests to run."
                    testState.testsDisabled = true
                    testAddon.enabled = false
                }

                def depChangelog = depProps.getProperty('thedevs.test.liquibase.change-log') ?: depProps.getProperty('main.liquibase.change-log')
                def hostChangelogInfo = resolveHostMainLiquibaseChangelog(p)
                def hostChangelog = hostChangelogInfo?.path
                def hostChangelogFile = hostChangelogInfo?.file

                if (depChangelog == null) {
                    println "::warning::[TD-2039] Could not determine Liquibase changelog for dependency '${baseModule}'"
                }
                if (hostChangelog == null) {
                    println "::warning::[TD-2039] Could not determine host Liquibase changelog for project '${p.path}'"
                }

                boolean hostAlreadyIncludesDep = false
                if (hostChangelogFile != null && hostChangelogFile.exists() && depChangelog != null) {
                    def hostText = hostChangelogFile.text
                    def depNorm = depChangelog.startsWith('/') ? depChangelog.substring(1) : depChangelog
                    if (hostText.contains(depChangelog) || hostText.contains(depNorm) || hostText.contains("/" + depNorm)) {
                        hostAlreadyIncludesDep = true
                    }
                }

                def xmlBuilder = new StringBuilder()
                xmlBuilder.append('<?xml version="1.0" encoding="UTF-8"?>\n')
                xmlBuilder.append('<databaseChangeLog\n')
                xmlBuilder.append('    xmlns="http://www.liquibase.org/xml/ns/dbchangelog"\n')
                xmlBuilder.append('    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"\n')
                xmlBuilder.append('    xsi:schemaLocation="http://www.liquibase.org/xml/ns/dbchangelog\n')
                xmlBuilder.append('        http://www.liquibase.org/xml/ns/dbchangelog/dbchangelog-latest.xsd">\n')

                if (depChangelog != null && !hostAlreadyIncludesDep) {
                    xmlBuilder.append("    <include file=\"${depChangelog}\" relativeToChangelogFile=\"false\"/>\n")
                }
                if (hostChangelog != null) {
                    xmlBuilder.append("    <include file=\"${hostChangelog}\" relativeToChangelogFile=\"false\"/>\n")
                }
                xmlBuilder.append('</databaseChangeLog>\n')
                aggregateFile.text = xmlBuilder.toString()
            }

            // 3. Configure test task
            testAddon.dependsOn(unpackTask)
            testAddon.testClassesDirs = p.files(classesDir)

            def starterProject = p.rootProject.subprojects.find { sp ->
                sp.name.endsWith('-starter') && sp.configurations.any { c ->
                    c.dependencies.any { d -> (d instanceof ProjectDependency) && (d.path == p.path || d.name == p.name) }
                }
            } ?: p.rootProject.subprojects.find { it.name == "${p.name}-starter" } ?:
                 p.rootProject.subprojects.find { it.name.endsWith('-starter') }
            def starterClassesDirs = (starterProject != null && starterProject.pluginManager.hasPlugin('java')) ?
                starterProject.sourceSets.main.output.classesDirs : p.files()
            // Extra output dirs registered via sourceSets.main.output.dir(...), e.g. Jmix-generated persistence.xml/orm.xml
            def starterGeneratedDirs = (starterProject != null && starterProject.pluginManager.hasPlugin('java')) ?
                starterProject.sourceSets.main.output.dirs : p.files()

            def mainResDir = p.layout.buildDirectory.dir("addon-tests/${baseModule}/host-resources/main")
            def filterHostMainResources = p.tasks.maybeCreate("filterHostMainResources_${baseModule}", Sync)
            filterHostMainResources.destinationDir = mainResDir.get().asFile
            filterHostMainResources.from(p.tasks.named('processResources'))
            filterHostMainResources.exclude 'META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports'
            testAddon.dependsOn(filterHostMainResources)

            def starterResDir = (starterProject != null && starterProject.pluginManager.hasPlugin('java')) ?
                p.layout.buildDirectory.dir("addon-tests/${baseModule}/host-resources/starter") : null
            if (starterResDir != null) {
                def filterHostStarterResources = p.tasks.maybeCreate("filterHostStarterResources_${baseModule}", Sync)
                filterHostStarterResources.destinationDir = starterResDir.get().asFile
                filterHostStarterResources.from(starterProject.tasks.named('processResources'))
                filterHostStarterResources.exclude 'META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports'
                testAddon.dependsOn(filterHostStarterResources)
            }

            def hostResourcesDirs = [mainResDir] + (starterResDir != null ? [starterResDir] : [])
            testAddon.classpath = p.files({
                if (testState.skippedPreRollout || testState.testsDisabled) {
                    return p.files()
                }
                return p.files(classesDir, aggregateFile.parentFile, hostResourcesDirs) +
                       addonTestClasspath +
                       p.sourceSets.main.output.classesDirs +
                       p.sourceSets.main.output.dirs +
                       starterClassesDirs +
                       starterGeneratedDirs +
                       runtimeClasspath
            })

            testAddon.useJUnitPlatform {
                excludeTags 'hsql-pending'
            }
            testAddon.failOnNoDiscoveredTests = false
            testAddon.filter.failOnNoMatchingTests = false

            testAddon.reports.html.outputLocation.set(p.layout.buildDirectory.dir("reports/tests/${testTaskName}"))
            testAddon.reports.junitXml.outputLocation.set(p.layout.buildDirectory.dir("test-results/${testTaskName}"))

            testAddon.doFirst {
                if (testState.skippedPreRollout || testState.testsDisabled) {
                    testAddon.setTestClassesDirs(p.files())
                    return
                }

                def propFile = new File(classesDir, "META-INF/thedevs-test.properties")
                if (propFile.exists()) {
                    def depProps = new Properties()
                    propFile.withInputStream { depProps.load(it) }
                    depProps.each { k, v ->
                        if (k.startsWith('thedevs.test.systemProperties.')) {
                            def sysProp = k.substring('thedevs.test.systemProperties.'.length())
                            testAddon.systemProperty(sysProp, v)
                        }
                    }
                }

                testAddon.systemProperty('main.liquibase.change-log', 'classpath:aggregate-changelog.xml')
                testAddon.systemProperty('spring.liquibase.change-log', 'classpath:aggregate-changelog.xml')
                testAddon.systemProperty('liquibase.duplicateFileMode', 'WARN')
            }

            testAddonDependencies.dependsOn(testAddon)
        }
    }
}
